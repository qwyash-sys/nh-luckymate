<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NH행운메이트</title>
<style>
  :root {
    --primary: #00A651;
    --primary-dark: #007A3D;
    --primary-light: #E7F7EE;
    --ball-yellow: #FBC400;
    --ball-blue: #69C8F2;
    --ball-red: #FF7272;
    --ball-gray: #AAAAAA;
    --ball-green: #B0D840;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: #EDEFF1;
    display:flex; justify-content:center; align-items:flex-start;
    padding: 40px 0;
  }
  a { text-decoration:none; color:inherit; }
  button { all:unset; box-sizing:border-box; cursor:pointer; }

  .phone {
    width: 390px;
    background: #fff;
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 8px solid #1c1c1e;
    position: relative;
  }

  .hero {
    position:relative; overflow:hidden;
    height: 700px; padding-bottom:44px;
    background: radial-gradient(120% 90% at 50% -10%, #14C879 0%, var(--primary) 42%, var(--primary-dark) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  /* 은은하게 떠다니는 로또볼 — 브랜드 모티프를 과하지 않게 배경에 녹여낸다 */
  .drift-ball {
    position:absolute; border-radius:50%; opacity:0.22;
    animation: drift 7s ease-in-out infinite;
  }
  @keyframes drift {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(12deg); }
  }

  .hero-badge {
    font-size:11px; font-weight:700; color:rgba(255,255,255,0.85);
    background:rgba(255,255,255,0.14); padding:6px 14px; border-radius:20px;
    letter-spacing:0.3px; position:relative; z-index:2;
  }

  .hero-emblem {
    margin-top:34px; width:88px; height:88px; border-radius:50%;
    background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:40px; box-shadow:0 12px 30px rgba(0,0,0,0.22);
    position:relative; z-index:2;
  }

  .hero-title {
    margin-top:22px; font-size:26px; font-weight:800; color:#fff;
    letter-spacing:-0.3px; position:relative; z-index:2;
  }
  .hero-tagline {
    margin-top:10px; font-size:13.5px; font-weight:500; color:rgba(255,255,255,0.88);
    line-height:1.6; text-align:center; position:relative; z-index:2;
  }

  .hero-feature-row {
    margin-top:32px; display:flex; gap:10px; position:relative; z-index:2;
  }
  .hero-feature {
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.22);
    border-radius:14px; padding:10px 13px; text-align:center; width:78px;
  }
  .hero-feature .ico { font-size:18px; display:block; margin-bottom:5px; }
  .hero-feature .lb { font-size:9.5px; font-weight:700; color:#fff; line-height:1.35; }

  .hero-actions {
    margin-top:44px; width:100%; padding:0 30px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    position:relative; z-index:2;
  }
  .start-btn {
    display:block; width:100%; text-align:center;
    background:#fff; color:var(--primary-dark);
    font-size:15px; font-weight:800; padding:16px; border-radius:16px;
    box-shadow:0 10px 24px rgba(0,0,0,0.18);
    transition: transform .15s ease;
  }
  .start-btn:active { transform:scale(0.98); }

  @media (max-width: 480px) {
    body { padding: 0; }
    .phone { width:100%; min-height:100vh; border:none; border-radius:0; box-shadow:none; }
    .hero { height:100vh; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="hero">
    <div class="drift-ball" style="width:34px;height:34px;top:12%;left:12%;background:var(--ball-yellow);animation-delay:0s;"></div>
    <div class="drift-ball" style="width:26px;height:26px;top:20%;right:14%;background:var(--ball-blue);animation-delay:1.2s;"></div>
    <div class="drift-ball" style="width:22px;height:22px;top:68%;left:9%;background:var(--ball-red);animation-delay:2.4s;"></div>
    <div class="drift-ball" style="width:30px;height:30px;top:74%;right:10%;background:var(--ball-green);animation-delay:0.8s;"></div>
    <div class="drift-ball" style="width:18px;height:18px;top:42%;right:22%;background:var(--ball-gray);animation-delay:1.8s;"></div>


    <div class="hero-badge">NH농협은행 미니앱</div>
    <div class="hero-emblem">🍀</div>
    <div class="hero-title">NH행운메이트</div>
    <div class="hero-tagline">당첨 확인부터 세금 계산, 명당 찾기까지<br>행운의 순간을 스마트하게 챙겨드려요</div>

    <div class="hero-feature-row">
      <div class="hero-feature"><span class="ico">🎯</span><span class="lb">당첨<br>조회</span></div>
      <div class="hero-feature"><span class="ico">💰</span><span class="lb">실수령액<br>계산</span></div>
      <div class="hero-feature"><span class="ico">📍</span><span class="lb">로또<br>명당</span></div>
      <div class="hero-feature"><span class="ico">🎱</span><span class="lb">번호<br>뽑기</span></div>
    </div>

    <div class="hero-actions">
      <a class="start-btn" href="nh_luckymate_mockup.html">시작하기 ›</a>
    </div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NH행운메이트 - 로또뽑기</title>
<style>
  :root {
    --primary: #00A651;
    --primary-dark: #007A3D;
    --primary-light: #E7F7EE;
    --primary-light2: #F0FBF4;
    --primary-border: #CDEEDA;
    --danger: #FF7272;
    --text-main: #111;
    --text-sub: #555;
    --text-mute: #999;
    --text-faint: #aaa;
    --bg-page: #EDEFF1;
    --bg-content: #F7F8FA;
    --bg-card: #fff;
    --border-light: #eee;
    --ball-yellow: #FBC400;
    --ball-blue: #69C8F2;
    --ball-red: #FF7272;
    --ball-gray: #AAAAAA;
    --ball-green: #B0D840;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  button { all:unset; box-sizing:border-box; cursor:pointer; }
  body {
    font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: var(--bg-page);
    display:flex; justify-content:center; align-items:flex-start;
    padding: 40px 0;
  }
  a { text-decoration:none; color:inherit; }
  .phone {
    width: 390px;
    background: var(--bg-card);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 8px solid #1c1c1e;
    position: relative;
    display:flex; flex-direction:column;
  }
  .statusbar {
    height: 30px;
    background: var(--bg-card);
    display:flex; justify-content:space-between; align-items:center;
    padding: 0 22px;
    font-size: 12px; font-weight:600; color:var(--text-main);
  }
  .toast {
    position:absolute; left:16px; right:16px; top:44px; z-index:150;
    background:#1c1c1e; color:#fff; font-size:12.5px; font-weight:600;
    padding:12px 14px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.3);
    opacity:0; transform:translateY(-8px); pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    line-height:1.5; text-align:center;
  }
  .toast.show { opacity:1; transform:translateY(0); }

  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;
    padding: 14px 18px 20px;
  }
  .header .top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .header .top .back { font-size:18px; }
  .header .top .title { font-size:16px; font-weight:700; }
  .header .top .dots { display:flex; align-items:center; color:#fff; opacity:0.92; }
  .header .top .dots svg { width:20px; height:20px; display:block; }
  .header .top .top-actions { display:flex; align-items:center; gap:10px; }
  .fontsize-btn {
    all:unset; box-sizing:border-box; cursor:pointer;
    width:22px; height:22px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.75);
    font-size:11px; font-weight:800; color:#fff; opacity:0.92;
    display:flex; align-items:center; justify-content:center;
  }
  .fontsize-btn.active { background:#fff; color:var(--primary-dark); opacity:1; border-color:#fff; }
  /* 4060세대 접근성: 본문 영역 전체를 확대(zoom)해서 폰트/버튼/여백을 함께 키운다.
     헤더·상태바·탭바는 고정 UI 톤 유지를 위해 그대로 둔다. */
  body.large-text .content { zoom: 1.18; }
  .header .sub {
    font-size: 18px; font-weight:800; line-height:1.35;
  }
  .header .sub span { font-weight:400; font-size:13px; display:block; margin-top:4px; opacity:0.9;}

  .content {
    padding: 18px; background:var(--bg-content);
    height: 600px; overflow-y: auto;
  }

  .card {
    background:var(--bg-card); border-radius:16px; padding:16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    margin-bottom: 14px;
  }
  .card-title { font-size:14.5px; font-weight:800; color:var(--text-main); margin-bottom:4px; display:flex; align-items:center; gap:6px; }
  .card-sub { font-size:11.5px; color:var(--text-mute); margin-bottom:14px; line-height:1.5; }

  .balls-row { display:flex; gap:7px; align-items:center; min-height:34px; flex-wrap:wrap; }
  .ball {
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; color:#fff; flex:none;
  }
  .b-yellow{background:var(--ball-yellow);color:#4a3900}
  .b-blue{background:var(--ball-blue);color:#04324d}
  .b-red{background:var(--ball-red);color:#4a0000}
  .b-gray{background:var(--ball-gray);color:#2b2b2b}
  .b-green{background:var(--ball-green);color:#2b3900}
  .chip-ball { cursor:pointer; position:relative; }
  .chip-ball::after {
    content:'×'; position:absolute; top:-4px; right:-4px; width:14px; height:14px;
    background:#777; color:#fff; border-radius:50%; font-size:10px; line-height:14px;
    font-weight:700; text-align:center;
  }
  .chip-empty { background:rgba(255,255,255,0.7) !important; border:1.5px dashed var(--primary-border); color:transparent; }
  .fixed-note { font-size:11px; color:var(--text-mute); margin-top:8px; }
  .my-num-input {
    width:100%; border:1px solid var(--primary-border); border-radius:10px;
    padding:10px 12px; font-size:12.5px; color:var(--text-main); background:#fff; margin-top:10px;
  }
  .my-num-input:focus { outline:none; border-color:var(--primary); }
  .my-num-input:disabled { background:#f2f4f6; color:var(--text-mute); }
  .suggest-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; min-height:32px; margin-top:8px; }
  .suggest-ball { cursor:pointer; width:30px; height:30px; font-size:12.5px; box-shadow:0 1px 5px rgba(0,0,0,0.18); }
  .suggest-msg { font-size:11.5px; color:var(--text-mute); }

  /* ===== 뽑기 기계 ===== */
  .draw-machine { display:flex; justify-content:center; margin:18px 0 6px; }
  .machine-dome {
    position:relative; width:150px; height:150px; border-radius:50%;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.95), rgba(231,247,238,0.55) 55%, rgba(205,238,218,0.35));
    border:3px solid var(--primary-border);
    box-shadow: inset 0 6px 16px rgba(0,0,0,0.07), 0 6px 16px rgba(0,0,0,0.08);
    overflow:hidden;
  }
  .machine-dome::after {
    content:''; position:absolute; top:9%; left:16%; width:26%; height:18%;
    background:rgba(255,255,255,0.6); border-radius:50%; filter:blur(3px);
  }
  .machine-chute {
    width:16px; height:20px; margin:-2px auto 0;
    background:var(--primary-border); border-radius:0 0 8px 8px;
  }
  .fly-ball {
    position:absolute; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:9.5px; font-weight:800; color:#fff;
    animation: mfloat 3s ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .machine-dome.spinning .fly-ball {
    animation: mshake 0.32s linear infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes mfloat {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50% { transform: translate(var(--dx,8px), var(--dy,-10px)) rotate(150deg); }
  }
  @keyframes mshake {
    0% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(16px,-9px) rotate(90deg); }
    50% { transform: translate(-13px,12px) rotate(180deg); }
    75% { transform: translate(11px,9px) rotate(270deg); }
    100% { transform: translate(0,0) rotate(360deg); }
  }
  .draw-btn {
    all:unset; box-sizing:border-box; cursor:pointer; display:block; width:100%; text-align:center;
    padding:13px; border-radius:12px; font-size:14px; font-weight:800; color:#fff;
    background:var(--primary); margin-top:10px;
  }
  .draw-btn.alt { background:linear-gradient(135deg,#FFB020,#FF7A45); }
  .draw-btn.disabled { opacity:0.55; pointer-events:none; }
  .result-row { display:flex; justify-content:center; gap:8px; margin-top:16px; min-height:34px; flex-wrap:wrap; }
  .result-row .ball {
    opacity:0; transform:scale(0.3) translateY(10px);
    animation: pop-in 0.38s ease forwards;
    animation-delay: var(--pd, 0s);
  }
  @keyframes pop-in { to { opacity:1; transform:scale(1) translateY(0); } }
  .draw-actions { display:flex; gap:8px; margin-top:14px; }
  .draw-actions button {
    all:unset; box-sizing:border-box; cursor:pointer; flex:1; text-align:center;
    padding:11px; border-radius:10px; font-size:12.5px; font-weight:700;
  }
  .redraw-btn { background:var(--bg-content); color:var(--text-sub); }
  .save-btn { background:var(--primary-light); color:var(--primary-dark); }

  .freq-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .freq-chip {
    width:28px; height:28px; border-radius:50%; font-size:11px;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
  }
  .pool-note { font-size:10.5px; color:var(--text-mute); margin-bottom:12px; }
  .fine-note { font-size:10px; color:var(--text-faint); margin-top:10px; line-height:1.5; }
  .loading-text { font-size:12px; color:var(--text-mute); padding:20px 0; text-align:center; }

  .tabbar {
    display:flex; border-top:1px solid var(--border-light); background:var(--bg-card);
    padding: 8px 0 14px;
  }
  .tabbar .tab { flex:1; text-align:center; font-size:9.5px; color:#bbb; }
  .tabbar .tab.active { color:var(--primary); font-weight:700; }
  .tabbar .tab .icon { font-size:18px; display:block; margin-bottom:3px; }

  /* ===== 세금상담 AI챗봇 ===== */
  .chat-fab, .chat-close { all:unset; box-sizing:border-box; cursor:pointer; }
  .chat-fab {
    position:absolute; right:16px; bottom:74px; z-index:60;
    width:50px; height:50px; border-radius:50%;
    background:linear-gradient(135deg,#0BBF63,#00893F);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,122,61,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .chat-fab:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,122,61,0.45); }
  .chat-fab svg { width:24px; height:24px; display:block; }
  .chat-fab .tip {
    position:absolute; right:58px; top:50%; transform:translateY(-50%);
    background:rgba(20,20,20,0.92); color:#fff; font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .chat-fab:hover .tip { opacity:1; }
  .chat-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.45);
    display:none; z-index:130; padding:10px;
  }
  .chat-overlay.show { display:block; }
  .chat-panel {
    width:100%; height:100%; background:#fff; border-radius:18px;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .chat-close {
    position:absolute; top:10px; right:10px; z-index:2;
    width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.07);
    color:var(--text-sub); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-close:hover { background:rgba(0,0,0,0.12); }
  .chat-body { flex:1; display:flex; align-items:center; justify-content:center; }
  .chat-body iframe { width:100%; height:100%; border:0; }
  .chat-placeholder { text-align:center; color:var(--text-mute); font-size:12px; line-height:1.75; padding:0 26px; }
  .chat-placeholder .ico { font-size:30px; display:block; margin-bottom:12px; opacity:.45; }

  @media (max-width: 480px) {
    body { padding: 0; align-items: stretch; }
    .phone {
      width: 100%; min-height: 100vh;
      border: none; border-radius: 0; box-shadow: none;
      overflow: visible;
    }
    .content { flex: 1 1 auto; height: auto; overflow-y: visible; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="toast" id="toast"></div>

  <div class="statusbar">
    <span>9:41</span><span>NH농협은행 · 올원뱅크</span><span>100%</span>
  </div>

  <div class="header">
    <div class="top">
      <a class="back" href="index.html">‹</a>
      <span class="title" data-i18n="hdrPageTitle">로또뽑기</span>
      <div class="top-actions">
        <button class="fontsize-btn" id="fontSizeBtn" aria-label="큰 글씨 보기">가</button>
        <a class="dots" href="nh_luckymate_language.html" aria-label="언어 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.2 9h17.6M3.2 15h17.6"/><path d="M12 3c2.4 2.4 3.6 5.4 3.6 9s-1.2 6.6-3.6 9c-2.4-2.4-3.6-5.4-3.6-9S9.6 5.4 12 3z"/></svg></a>
      </div>
    </div>
    <div class="sub">
      <span data-i18n="hdrTitle">이번주 번호, 재미있게 뽑아볼까요?</span>
      <span data-i18n="hdrSub">필수 번호를 고르고 나머지는 랜덤으로 뽑아드려요</span>
    </div>
  </div>

  <div class="content">

    <!-- ===== 1. 이번주 로또 뽑기 (게임화 랜덤 번호 생성) ===== -->
    <div class="card">
      <div class="card-title">🎱 <span data-i18n="secDrawTitle">이번주 로또 뽑기</span></div>
      <div class="card-sub" data-i18n="secDrawSub">원하는 번호를 최대 5개까지 고정하고, 나머지는 기계가 뽑아드려요</div>

      <div class="balls-row" id="fixedBallsRow"></div>
      <input type="text" id="fixedDigitInput" class="my-num-input" inputmode="numeric" autocomplete="off"
             data-i18n-placeholder="digitPlaceholder" placeholder="번호를 입력하세요 (1~45)">
      <div class="suggest-row" id="fixedSuggestRow"></div>

      <div class="draw-machine">
        <div>
          <div class="machine-dome" id="machineDome">
            <div class="fly-ball b-yellow" style="top:14%;left:18%;--dx:10px;--dy:-8px;--delay:0s">3</div>
            <div class="fly-ball b-blue" style="top:10%;left:56%;--dx:-8px;--dy:10px;--delay:.3s">18</div>
            <div class="fly-ball b-red" style="top:32%;left:74%;--dx:-10px;--dy:-6px;--delay:.6s">27</div>
            <div class="fly-ball b-gray" style="top:52%;left:12%;--dx:9px;--dy:9px;--delay:.15s">33</div>
            <div class="fly-ball b-green" style="top:46%;left:44%;--dx:-6px;--dy:-10px;--delay:.45s">41</div>
            <div class="fly-ball b-blue" style="top:62%;left:66%;--dx:8px;--dy:-9px;--delay:.75s">9</div>
            <div class="fly-ball b-red" style="top:74%;left:28%;--dx:-9px;--dy:7px;--delay:.5s">22</div>
            <div class="fly-ball b-yellow" style="top:78%;left:54%;--dx:7px;--dy:8px;--delay:.9s">6</div>
          </div>
          <div class="machine-chute"></div>
        </div>
      </div>

      <button class="draw-btn" id="drawBtn" data-i18n="drawBtnIdle">🎱 뽑기 시작</button>

      <div class="result-row" id="drawResult"></div>
      <div class="draw-actions" id="drawActions" style="display:none;">
        <button class="redraw-btn" id="redrawBtn" data-i18n="redrawBtn">다시 뽑기</button>
        <button class="save-btn" id="saveMyNumBtn" data-i18n="saveMyNumBtn">내 번호로 저장</button>
      </div>
    </div>

    <!-- ===== 2. 3등 당첨 챌린지 (번호 뽑기 버전) ===== -->
    <div class="card">
      <div class="card-title">🍀 <span data-i18n="secThirdTitle">3등 당첨 챌린지</span></div>
      <div class="card-sub" data-i18n="secThirdSub">역대 당첨번호에 가장 많이 나온 번호들로 3등 스타일 번호를 뽑아봐요</div>

      <div id="thirdBody">
        <div class="loading-text" data-i18n="loadingText">불러오는 중...</div>
      </div>
    </div>

  </div>

  <button class="chat-fab" id="chatFab" aria-label="세금상담 AI챗봇">
    <span class="tip" data-i18n="chatbotLabel">세금상담 AI챗봇</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 11.7c0 4.3-3.8 7.8-8.5 7.8-1.3 0-2.5-.3-3.6-.8L3.5 20.4l1.6-4.3c-1-1.2-1.6-2.7-1.6-4.4 0-4.3 3.8-7.8 8.5-7.8s8.5 3.5 8.5 7.8z"/>
      <circle cx="8.8" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
      <circle cx="15.2" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-panel">
      <button class="chat-close" id="chatClose" aria-label="닫기">✕</button>
      <div class="chat-body" id="chatBody"></div>
    </div>
  </div>

  <div class="tabbar">
    <a class="tab" href="nh_luckymate_mockup.html"><span class="icon">🏠</span><span data-i18n="tabHome">당첨조회</span></a>

    <a class="tab" href="nh_luckymate_bonus.html"><span class="icon">💳</span><span data-i18n="tabBonus">우대금리</span></a>

    <a class="tab active" href="nh_luckymate_draw.html"><span class="icon">🎱</span><span data-i18n="tabDraw">로또뽑기</span></a>
  </div>

<script>

let LANG = 'ko';
try { LANG = localStorage.getItem('nh_lang') || 'ko'; } catch(e) {}

function t(key, vars){
  const dict = I18N[LANG] || I18N.ko;
  let str = dict[key] !== undefined ? dict[key] : (I18N.ko[key] !== undefined ? I18N.ko[key] : key);
  if(vars) Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  return str;
}
function applyStaticI18n(){
  const dict = I18N[LANG] || I18N.ko;
  document.documentElement.lang = LANG;
  document.title = 'NH행운메이트 - ' + dict.hdrPageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if(dict[k] !== undefined) el.textContent = dict[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const k = el.getAttribute('data-i18n-placeholder');
    if(dict[k] !== undefined) el.placeholder = dict[k];
  });
}
applyStaticI18n();

function ballColorClass(n){
  if(n<=10) return 'b-yellow';
  if(n<=20) return 'b-blue';
  if(n<=30) return 'b-red';
  if(n<=40) return 'b-gray';
  return 'b-green';
}
const NUMS = Array.from({ length: 45 }, (_, i) => i + 1);
const MY_NUM_KEY = 'nh_my_numbers';

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 3200);
}

/* ===== 1. 고정 번호 선택 (최대 5개) ===== */
let fixedNumbers = [];

function renderFixedRow(){
  const wrap = document.getElementById('fixedBallsRow');
  wrap.innerHTML = '';
  fixedNumbers.slice().sort((a,b) => a-b).forEach(n => {
    const chip = document.createElement('div');
    chip.className = 'ball chip-ball ' + ballColorClass(n);
    chip.textContent = n;
    chip.addEventListener('click', () => {
      fixedNumbers = fixedNumbers.filter(x => x !== n);
      renderFixedRow();
      renderFixedSuggestions();
    });
    wrap.appendChild(chip);
  });
  for(let i = fixedNumbers.length; i < 5; i++){
    const e = document.createElement('div');
    e.className = 'ball chip-empty';
    wrap.appendChild(e);
  }
}

function renderFixedSuggestions(){
  const input = document.getElementById('fixedDigitInput');
  const wrap = document.getElementById('fixedSuggestRow');
  wrap.innerHTML = '';

  if(fixedNumbers.length >= 5){
    input.disabled = true;
    wrap.innerHTML = '<span class="suggest-msg">' + t('allFixedSelected') + '</span>';
    return;
  }
  input.disabled = false;

  const digits = input.value.replace(/[^0-9]/g, '');
  if(!digits) return;

  const candidates = NUMS.filter(n => !fixedNumbers.includes(n) && String(n).startsWith(digits));
  if(!candidates.length){
    const num = Number(digits);
    wrap.innerHTML = '<span class="suggest-msg">' +
      ((num >= 1 && num <= 45 && fixedNumbers.includes(num)) ? t('alreadySelected') : t('noMatch')) + '</span>';
    return;
  }
  candidates.forEach(n => {
    const b = document.createElement('div');
    b.className = 'ball suggest-ball ' + ballColorClass(n);
    b.textContent = n;
    b.addEventListener('click', () => {
      if(fixedNumbers.length >= 5 || fixedNumbers.includes(n)) return;
      fixedNumbers.push(n);
      input.value = '';
      renderFixedRow();
      renderFixedSuggestions();
      input.focus();
    });
    wrap.appendChild(b);
  });
}

document.getElementById('fixedDigitInput').addEventListener('input', renderFixedSuggestions);
document.getElementById('fixedDigitInput').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const digits = e.target.value.replace(/[^0-9]/g, '');
  const candidates = NUMS.filter(n => !fixedNumbers.includes(n) && String(n).startsWith(digits));
  if(candidates.length === 1 && fixedNumbers.length < 5){
    fixedNumbers.push(candidates[0]);
    e.target.value = '';
    renderFixedRow();
    renderFixedSuggestions();
  }
});

renderFixedRow();

/* ===== 뽑기 기계 애니메이션 + 번호 생성 ===== */
function generateNumbers(fixed){
  const result = new Set(fixed);
  while(result.size < 6){
    result.add(1 + Math.floor(Math.random() * 45));
  }
  return Array.from(result).sort((a, b) => a - b);
}

function renderResultBalls(containerId, numbers){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = numbers.map((n, i) => `
    <div class="ball ${ballColorClass(n)}" style="--pd:${i * 0.12}s">${n}</div>
  `).join('');
}

let drawing = false;
document.getElementById('drawBtn').addEventListener('click', () => {
  if(drawing) return;
  drawing = true;
  const btn = document.getElementById('drawBtn');
  const dome = document.getElementById('machineDome');
  btn.classList.add('disabled');
  btn.textContent = t('drawBtnDrawing');
  dome.classList.add('spinning');
  document.getElementById('drawResult').innerHTML = '';
  document.getElementById('drawActions').style.display = 'none';

  setTimeout(() => {
    dome.classList.remove('spinning');
    const result = generateNumbers(fixedNumbers);
    renderResultBalls('drawResult', result);
    document.getElementById('drawActions').style.display = 'flex';
    btn.classList.remove('disabled');
    btn.textContent = t('drawBtnIdle');
    drawing = false;
    document.getElementById('saveMyNumBtn').dataset.numbers = JSON.stringify(result);
  }, 1300);
});

document.getElementById('redrawBtn').addEventListener('click', () => {
  document.getElementById('drawBtn').click();
});

document.getElementById('saveMyNumBtn').addEventListener('click', (e) => {
  const numbers = JSON.parse(e.currentTarget.dataset.numbers || '[]');
  if(!numbers.length) return;
  try { localStorage.setItem(MY_NUM_KEY, JSON.stringify(numbers)); } catch(err) {}
  showToast(t('toastSaved'));
});

/* ===== 2. 3등 당첨 챌린지 (역대 최다 출현 번호 기반 뽑기) =====
   3등은 6개 중 5개를 맞춰야 하므로, 실제 당첨번호 6개에 자주 포함된 번호일수록
   "3등이 될 뻔한 조합"에도 그만큼 자주 등장한 셈이다. 그래서 역대 전체 출현빈도
   TOP15 번호 풀에서 6개를 무작위로 뽑아 "3등 스타일" 조합을 만들어준다.
   (실제 당첨 확률을 높여주는 것은 아니며, 어디까지나 재미로 보는 통계 코너) */
const DH_API_URL = 'https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do?srchLtEpsd=all';
const CACHE_KEY = 'nh_dh645_cache_v2';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
const FALLBACK_DRAWS = [
  { r: 1180, d: '20260815', n: [3,11,19,27,33,41], b: 18, amt: [2000000000,60000000,1500000,50000,5000], cnt: [1,2,45,2200,35000] }
];

async function loadDrawData(){
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && Array.isArray(cached.list) && cached.list.length && (Date.now() - cached.t < CACHE_TTL_MS)){
      return cached.list;
    }
  } catch(e) {}
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(DH_API_URL, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const raw = (json.data && json.data.list) || [];
    const list = raw.map(d => ({
      r: d.ltEpsd, d: d.ltRflYmd,
      n: [d.tm1WnNo, d.tm2WnNo, d.tm3WnNo, d.tm4WnNo, d.tm5WnNo, d.tm6WnNo],
      b: d.bnsWnNo,
      amt: [d.rnk1WnAmt, d.rnk2WnAmt, d.rnk3WnAmt, d.rnk4WnAmt, d.rnk5WnAmt],
      cnt: [d.rnk1WnNope, d.rnk2WnNope, d.rnk3WnNope, d.rnk4WnNope, d.rnk5WnNope],
    })).sort((a, b) => a.r - b.r);
    if(!list.length) throw new Error('empty list');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), list })); } catch(e) {}
    return list;
  } catch(e) {
    console.warn('동행복권 API 연동 실패, 데모 데이터로 대체합니다:', e);
    return FALLBACK_DRAWS;
  }
}

let FREQ_POOL = [];
let LATEST_ROUND = 0;

function computeTopFrequent(draws, topN){
  const counts = new Array(46).fill(0);
  draws.forEach(d => d.n.forEach(n => counts[n]++));
  return NUMS.slice().sort((a, b) => counts[b] - counts[a]).slice(0, topN);
}

function renderThirdSection(){
  const body = document.getElementById('thirdBody');
  body.innerHTML = `
    <div class="freq-chips" id="freqChips"></div>
    <div class="pool-note" id="poolNote"></div>
    <button class="draw-btn alt" id="thirdDrawBtn" data-i18n="thirdDrawBtn">🍀 3등 번호 뽑기</button>
    <div class="result-row" id="thirdResult"></div>
    <div class="fine-note" data-i18n="thirdNote">* 실제 당첨 확률이 올라가는 건 아니에요. 통계로 보는 재미 코너예요</div>
  `;
  document.getElementById('freqChips').innerHTML = FREQ_POOL.slice().sort((a,b)=>a-b).map(n =>
    `<div class="freq-chip ${ballColorClass(n)}">${n}</div>`
  ).join('');
  document.getElementById('poolNote').textContent = t('poolNoteTpl', { end: LATEST_ROUND });

  document.getElementById('thirdDrawBtn').addEventListener('click', () => {
    const pool = FREQ_POOL.slice();
    const picked = new Set();
    while(picked.size < 6 && picked.size < pool.length){
      picked.add(pool[Math.floor(Math.random() * pool.length)]);
    }
    renderResultBalls('thirdResult', Array.from(picked).sort((a,b)=>a-b));
  });
}

(async function initThird(){
  const list = await loadDrawData();
  LATEST_ROUND = list.length ? list[list.length - 1].r : 0;
  FREQ_POOL = computeTopFrequent(list, 15);
  renderThirdSection();
})();
</script>

          chatT('chatbotPlaceholder', '세금상담 AI챗봇을 연결할 자리예요') + '</div>';
      loaded = true;
    }
    overlay.classList.add('show');
  }
  function closeChat(){ overlay.classList.remove('show'); }

  document.getElementById('chatFab').addEventListener('click', openChat);
  document.getElementById('chatClose').addEventListener('click', closeChat);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeChat(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeChat(); });
})();
</script>

<script>
/* ===== 큰글씨 보기(4060세대 접근성) — 전 화면 공통, localStorage로 유지 ===== */
(function(){
  var FONT_KEY = 'nh_fontsize';
  function isLarge(){ try { return localStorage.getItem(FONT_KEY) === 'large'; } catch(e){ return false; } }
  function applyFontSize(){
    var on = isLarge();
    document.body.classList.toggle('large-text', on);
    var btn = document.getElementById('fontSizeBtn');
    if(btn) btn.classList.toggle('active', on);
  }
  document.addEventListener('DOMContentLoaded', function(){
    applyFontSize();
    var btn = document.getElementById('fontSizeBtn');
    if(btn){
      btn.addEventListener('click', function(){
        try { localStorage.setItem(FONT_KEY, isLarge() ? 'normal' : 'large'); } catch(e){}
        applyFontSize();
      });
    }
  });
})();
</script>

</body>
</html>

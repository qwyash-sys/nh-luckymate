<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NH행운메이트 - 로또뽑기</title>
<style>
  :root {
    --primary: #00A651;
    --primary-dark: #007A3D;
    --primary-light: #E7F7EE;
    --primary-light2: #F0FBF4;
    --primary-border: #CDEEDA;
    --danger: #FF7272;
    --text-main: #111;
    --text-sub: #555;
    --text-mute: #999;
    --text-faint: #aaa;
    --bg-page: #EDEFF1;
    --bg-content: #F7F8FA;
    --bg-card: #fff;
    --border-light: #eee;
    --ball-yellow: #FBC400;
    --ball-blue: #69C8F2;
    --ball-red: #FF7272;
    --ball-gray: #AAAAAA;
    --ball-green: #B0D840;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  button { all:unset; box-sizing:border-box; cursor:pointer; }
  body {
    font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: var(--bg-page);
    display:flex; justify-content:center; align-items:flex-start;
    padding: 40px 0;
  }
  a { text-decoration:none; color:inherit; }
  .phone {
    width: 390px;
    background: var(--bg-card);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 8px solid #1c1c1e;
    position: relative;
    display:flex; flex-direction:column;
  }
  .statusbar {
    height: 30px;
    background: var(--bg-card);
    display:flex; justify-content:space-between; align-items:center;
    padding: 0 22px;
    font-size: 12px; font-weight:600; color:var(--text-main);
  }
  /* 화면 최상단 토스트 대신, 뽑기 카드 안쪽에서 바로 보이는 인라인 알림을 쓴다
     (스크롤이 카드 아래쪽에 가 있으면 화면 맨 위 토스트는 안 보이는 문제가 있었음) */
  .inline-toast {
    margin-top:0; max-height:0; overflow:hidden; opacity:0;
    background:var(--primary-light); color:var(--primary-dark);
    font-size:12px; font-weight:700; text-align:center; border-radius:10px;
    transition: opacity .2s ease, max-height .2s ease, margin-top .2s ease, padding .2s ease;
  }
  .inline-toast.show { opacity:1; max-height:60px; margin-top:10px; padding:10px 12px; }

  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;
    padding: 14px 18px 20px;
  }
  .header .top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .header .top .back { font-size:18px; }
  .header .top .title { font-size:16px; font-weight:700; }
  .header .top .dots { display:flex; align-items:center; color:#fff; opacity:0.92; }
  .header .top .dots svg { width:20px; height:20px; display:block; }
  .header .top .top-actions { display:flex; align-items:center; gap:10px; }
  .fontsize-btn {
    all:unset; box-sizing:border-box; cursor:pointer;
    width:22px; height:22px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.75);
    font-size:11px; font-weight:800; color:#fff; opacity:0.92;
    display:flex; align-items:center; justify-content:center;
  }
  .fontsize-btn.active { background:#fff; color:var(--primary-dark); opacity:1; border-color:#fff; }
  /* 4060세대 접근성: 본문 영역 전체를 확대(zoom)해서 폰트/버튼/여백을 함께 키운다.
     헤더·상태바·탭바는 고정 UI 톤 유지를 위해 그대로 둔다. */
  body.large-text .content { zoom: 1.18; }
  .header .sub {
    font-size: 18px; font-weight:800; line-height:1.35;
  }
  .header .sub span { font-weight:400; font-size:13px; display:block; margin-top:4px; opacity:0.9;}

  .content {
    padding: 18px; background:var(--bg-content);
    height: 600px; overflow-y: auto;
  }

  .card {
    background:var(--bg-card); border-radius:16px; padding:16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    margin-bottom: 14px;
  }
  .card-title { font-size:14.5px; font-weight:800; color:var(--text-main); margin-bottom:4px; display:flex; align-items:center; gap:6px; }
  .card-sub { font-size:11.5px; color:var(--text-mute); margin-bottom:14px; line-height:1.5; }

  .balls-row { display:flex; gap:7px; align-items:center; min-height:34px; flex-wrap:wrap; }
  .ball {
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; color:#fff; flex:none;
  }
  .b-yellow{background:var(--ball-yellow);color:#4a3900}
  .b-blue{background:var(--ball-blue);color:#04324d}
  .b-red{background:var(--ball-red);color:#4a0000}
  .b-gray{background:var(--ball-gray);color:#2b2b2b}
  .b-green{background:var(--ball-green);color:#2b3900}
  .chip-ball { cursor:pointer; position:relative; }
  .chip-ball::after {
    content:'×'; position:absolute; top:-4px; right:-4px; width:14px; height:14px;
    background:#777; color:#fff; border-radius:50%; font-size:10px; line-height:14px;
    font-weight:700; text-align:center;
  }
  .chip-empty { background:rgba(255,255,255,0.7) !important; border:1.5px dashed var(--primary-border); color:transparent; }
  .fixed-note { font-size:11px; color:var(--text-mute); margin-top:8px; }
  .my-num-input {
    width:100%; border:1px solid var(--primary-border); border-radius:10px;
    padding:10px 12px; font-size:12.5px; color:var(--text-main); background:#fff; margin-top:10px;
  }
  .my-num-input:focus { outline:none; border-color:var(--primary); }
  .my-num-input:disabled { background:#f2f4f6; color:var(--text-mute); }
  .suggest-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; min-height:32px; margin-top:8px; }
  .suggest-ball { cursor:pointer; width:30px; height:30px; font-size:12.5px; box-shadow:0 1px 5px rgba(0,0,0,0.18); }
  .suggest-msg { font-size:11.5px; color:var(--text-mute); }

  /* ===== 뽑기 기계 ===== */
  .draw-machine { display:flex; justify-content:center; margin:18px 0 6px; }
  .machine-dome {
    position:relative; width:150px; height:150px; border-radius:50%;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.95), rgba(231,247,238,0.55) 55%, rgba(205,238,218,0.35));
    border:3px solid var(--primary-border);
    box-shadow: inset 0 6px 16px rgba(0,0,0,0.07), 0 6px 16px rgba(0,0,0,0.08);
    overflow:hidden;
  }
  .machine-dome::after {
    content:''; position:absolute; top:9%; left:16%; width:26%; height:18%;
    background:rgba(255,255,255,0.6); border-radius:50%; filter:blur(3px);
  }
  .machine-chute {
    width:16px; height:20px; margin:-2px auto 0;
    background:var(--primary-border); border-radius:0 0 8px 8px;
  }
  .fly-ball {
    position:absolute; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:9.5px; font-weight:800; color:#fff;
    animation: mfloat 3s ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .machine-dome.spinning .fly-ball {
    animation: mshake 0.32s linear infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes mfloat {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50% { transform: translate(var(--dx,8px), var(--dy,-10px)) rotate(150deg); }
  }
  @keyframes mshake {
    0% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(16px,-9px) rotate(90deg); }
    50% { transform: translate(-13px,12px) rotate(180deg); }
    75% { transform: translate(11px,9px) rotate(270deg); }
    100% { transform: translate(0,0) rotate(360deg); }
  }
  .draw-btn {
    all:unset; box-sizing:border-box; cursor:pointer; display:block; width:100%; text-align:center;
    padding:13px; border-radius:12px; font-size:14px; font-weight:800; color:#fff;
    background:var(--primary); margin-top:10px;
  }
  .draw-btn.alt { background:linear-gradient(135deg,#FFB020,#FF7A45); }
  .draw-btn.disabled { opacity:0.55; pointer-events:none; }
  .result-row { display:flex; justify-content:center; gap:8px; margin-top:16px; min-height:34px; flex-wrap:wrap; }
  .result-row .ball {
    opacity:0; transform:scale(0.3) translateY(10px);
    animation: pop-in 0.38s ease forwards;
    animation-delay: var(--pd, 0s);
  }
  @keyframes pop-in { to { opacity:1; transform:scale(1) translateY(0); } }
  .draw-actions { display:flex; gap:8px; margin-top:14px; }
  .draw-actions button {
    all:unset; box-sizing:border-box; cursor:pointer; flex:1; text-align:center;
    padding:11px; border-radius:10px; font-size:12.5px; font-weight:700;
  }
  .redraw-btn { background:var(--bg-content); color:var(--text-sub); }
  .save-btn { background:var(--primary-light); color:var(--primary-dark); }

  .freq-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .freq-chip {
    width:28px; height:28px; border-radius:50%; font-size:11px;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
  }
  .pool-note { font-size:10.5px; color:var(--text-mute); margin-bottom:12px; }
  .fine-note { font-size:10px; color:var(--text-faint); margin-top:10px; line-height:1.5; }
  .loading-text { font-size:12px; color:var(--text-mute); padding:20px 0; text-align:center; }

  /* ===== 재미로보는통계에서 옮겨온 3등 당첨 챌린지(근접확률·투자비교) ===== */
  .bar-tooltip {
    position:absolute; left:0; top:0; transform:translate(-50%, calc(-100% - 8px));
    background:rgba(20,20,20,0.92); color:#fff; font-size:10.5px; font-weight:700;
    padding:5px 9px; border-radius:7px; white-space:nowrap; pointer-events:none;
    opacity:0; transition:opacity 0.12s ease; z-index:80;
  }
  .bar-tooltip.show { opacity:1; }

  .stat-row { display:flex; justify-content:space-between; margin-top:14px; gap:6px; }
  .stat-item { text-align:center; flex:1; }
  .stat-item .num { font-size:15px; font-weight:800; color:var(--text-main); }
  .stat-item .label { font-size:10px; color:var(--text-mute); margin-top:3px; line-height:1.3; }

  .ch-hero {
    background:var(--primary-light2); border:1px solid var(--primary-border);
    border-radius:12px; padding:13px 14px; margin-bottom:14px;
  }
  .ch-hero .t { font-size:14px; font-weight:800; color:var(--text-main); margin-bottom:4px; }
  .ch-hero .s { font-size:11px; color:var(--text-sub); }
  .ch-hero .s b { color:var(--primary-dark); }
  .ch-chart { height: 120px; display:flex; align-items:flex-end; gap:6px; padding:4px 2px 0; }
  .ch-chart .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .ch-chart .bar { width: 14px; border-radius: 3px 3px 0 0; background:var(--primary-border); min-height:2px; }
  .ch-chart .bar.now { background:var(--primary); }
  .ch-chart .lb { font-size:8.5px; color:var(--text-faint); margin-top:4px; }

  .near-box {
    background:#FFF8E8; border:1px solid #F2DFAE; border-radius:12px;
    padding:13px 14px; margin-bottom:14px;
  }
  .near-t { font-size:13.5px; font-weight:800; color:#8A6200; margin-bottom:10px; }
  .near-t b { color:#C8410B; }
  .near-balls { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:9px; }
  .near-balls .mini {
    width:24px; height:24px; border-radius:50%; font-size:10.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; color:#fff; flex:none;
  }
  .near-balls .mini.target { box-shadow:0 0 0 2px #fff, 0 0 0 4px #C8410B; }
  .near-balls .sep { font-size:11px; color:#8A6200; font-weight:700; margin:0 2px; }
  .near-p { font-size:11.5px; color:var(--text-sub); line-height:1.55; }
  .near-p b { color:#C8410B; font-size:13px; }

  .invest-box {
    background:linear-gradient(135deg,#F2FBF5,var(--primary-light));
    border:1px solid var(--primary-border); border-radius:14px; padding:15px; margin-top:14px;
  }
  .invest-t { font-size:13.5px; font-weight:800; color:var(--text-main); margin-bottom:6px; }
  .invest-d { font-size:11.5px; color:var(--text-sub); line-height:1.6; margin-bottom:10px; }
  .invest-cost {
    font-size:21px; font-weight:800; color:var(--primary-dark); letter-spacing:-0.5px;
    animation: costIn 0.5s ease-out both;
  }
  @keyframes costIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .invest-q { font-size:12px; font-weight:700; color:var(--text-main); margin:12px 0 9px; }
  .mall-link {
    display:block; text-align:center; font-size:11px; font-weight:700; color:var(--primary-dark);
    background:var(--primary-light); border-radius:9px; padding:9px; margin-top:10px;
  }
  .prod-card {
    background:#fff; border-radius:11px; padding:11px 12px; margin-bottom:8px;
    border:1px solid var(--primary-border);
  }
  .prod-card:last-child { margin-bottom:0; }
  .prod-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:5px; }
  .prod-name { font-size:12.5px; font-weight:800; color:var(--text-main); }
  .prod-rate { font-size:12.5px; font-weight:800; color:var(--primary-dark); white-space:nowrap; }
  .prod-cond { font-size:10.5px; color:var(--text-mute); margin-bottom:6px; }
  .prod-earn { font-size:12px; font-weight:700; color:var(--text-main); display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .prod-earn .pre { color:var(--primary-dark); }
  .prod-earn .post { color:var(--text-sub); }
  .prod-earn.sub { font-size:11px; font-weight:600; opacity:0.75; margin-top:2px; }

  .info-mark {
    display:inline-flex; align-items:center; justify-content:center;
    width:14px; height:14px; border-radius:50%; background:#C3CBD2; color:#fff;
    font-size:9.5px; font-weight:800; cursor:pointer; flex:none; font-style:normal;
  }
  .info-pop {
    position:absolute; left:0; top:0; transform:translate(-50%, calc(-100% - 8px));
    background:rgba(20,20,20,0.93); color:#fff; font-size:10.5px; font-weight:500;
    padding:8px 10px; border-radius:8px; width:230px; line-height:1.5; pointer-events:none;
    opacity:0; transition:opacity 0.12s ease; z-index:90;
  }
  .info-pop.show { opacity:1; }
  .sub-divider { height:1px; background:var(--border-light); margin:18px 0 16px; }
  .sub-heading { font-size:13.5px; font-weight:800; color:var(--text-main); margin-bottom:4px; display:flex; align-items:center; gap:6px; }

  .tabbar {
    display:flex; border-top:1px solid var(--border-light); background:var(--bg-card);
    padding: 8px 0 14px;
  }
  .tabbar .tab { flex:1; text-align:center; font-size:9.5px; color:#bbb; }
  .tabbar .tab.active { color:var(--primary); font-weight:700; }
  .tabbar .tab .icon { font-size:18px; display:block; margin-bottom:3px; }

  /* ===== 세금상담 AI챗봇 ===== */
  .chat-fab, .chat-close { all:unset; box-sizing:border-box; cursor:pointer; }
  .chat-fab {
    position:absolute; right:16px; bottom:74px; z-index:60;
    width:50px; height:50px; border-radius:50%;
    background:linear-gradient(135deg,#0BBF63,#00893F);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,122,61,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .chat-fab:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,122,61,0.45); }
  .chat-fab svg { width:24px; height:24px; display:block; }
  .chat-fab .tip {
    position:absolute; right:58px; top:50%; transform:translateY(-50%);
    background:rgba(20,20,20,0.92); color:#fff; font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .chat-fab:hover .tip { opacity:1; }
  .chat-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.45);
    display:none; z-index:130; padding:10px;
  }
  .chat-overlay.show { display:block; }
  .chat-panel {
    width:100%; height:100%; background:#fff; border-radius:18px;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .chat-close {
    position:absolute; top:10px; right:10px; z-index:2;
    width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.07);
    color:var(--text-sub); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-close:hover { background:rgba(0,0,0,0.12); }
  .chat-body { flex:1; display:flex; align-items:center; justify-content:center; }
  .chat-body iframe { width:100%; height:100%; border:0; }
  .chat-placeholder { text-align:center; color:var(--text-mute); font-size:12px; line-height:1.75; padding:0 26px; }
  .chat-placeholder .ico { font-size:30px; display:block; margin-bottom:12px; opacity:.45; }

  @media (max-width: 480px) {
    body { padding: 0; align-items: stretch; }
    .phone {
      width: 100%; min-height: 100vh;
      border: none; border-radius: 0; box-shadow: none;
      overflow: visible;
    }
    .content { flex: 1 1 auto; height: auto; overflow-y: visible; }
  }
</style>
</head>
<body>

<div class="phone">

  <div class="statusbar">
    <span>9:41</span><span>NH농협은행 · 올원뱅크</span><span>100%</span>
  </div>

  <div class="header">
    <div class="top">
      <a class="back" href="index.html">‹</a>
      <span class="title" data-i18n="hdrPageTitle">로또뽑기</span>
      <div class="top-actions">
        <button class="fontsize-btn" id="fontSizeBtn" aria-label="큰 글씨 보기">가</button>
        <a class="dots" href="nh_luckymate_language.html" aria-label="언어 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.2 9h17.6M3.2 15h17.6"/><path d="M12 3c2.4 2.4 3.6 5.4 3.6 9s-1.2 6.6-3.6 9c-2.4-2.4-3.6-5.4-3.6-9S9.6 5.4 12 3z"/></svg></a>
      </div>
    </div>
    <div class="sub">
      <span data-i18n="hdrTitle">이번주 번호, 재미있게 뽑아볼까요?</span>
      <span data-i18n="hdrSub">필수 번호를 고르고 나머지는 랜덤으로 뽑아드려요</span>
    </div>
  </div>

  <div class="content">

    <!-- ===== 1. 이번주 로또 뽑기 (게임화 랜덤 번호 생성) ===== -->
    <div class="card">
      <div class="card-title">🎱 <span data-i18n="secDrawTitle">이번주 로또 뽑기</span></div>
      <div class="card-sub" data-i18n="secDrawSub">원하는 번호를 최대 5개까지 고정하고, 나머지는 기계가 뽑아드려요</div>

      <div class="balls-row" id="fixedBallsRow"></div>
      <input type="text" id="fixedDigitInput" class="my-num-input" inputmode="numeric" autocomplete="off"
             data-i18n-placeholder="digitPlaceholder" placeholder="번호를 입력하세요 (1~45)">
      <div class="suggest-row" id="fixedSuggestRow"></div>

      <div class="draw-machine">
        <div>
          <div class="machine-dome" id="machineDome">
            <div class="fly-ball b-yellow" style="top:14%;left:18%;--dx:10px;--dy:-8px;--delay:0s">3</div>
            <div class="fly-ball b-blue" style="top:10%;left:56%;--dx:-8px;--dy:10px;--delay:.3s">18</div>
            <div class="fly-ball b-red" style="top:32%;left:74%;--dx:-10px;--dy:-6px;--delay:.6s">27</div>
            <div class="fly-ball b-gray" style="top:52%;left:12%;--dx:9px;--dy:9px;--delay:.15s">33</div>
            <div class="fly-ball b-green" style="top:46%;left:44%;--dx:-6px;--dy:-10px;--delay:.45s">41</div>

const LOCALE_MAP = { ko:'ko-KR', en:'en-US', zh:'zh-CN', vi:'vi-VN', th:'th-TH', uz:'uz-UZ' };
let LANG = 'ko';
try { LANG = localStorage.getItem('nh_lang') || 'ko'; } catch(e) {}

function t(key, vars){
  const dict = I18N[LANG] || I18N.ko;
  let str = dict[key] !== undefined ? dict[key] : (I18N.ko[key] !== undefined ? I18N.ko[key] : key);
  if(vars) Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  return str;
}
function applyStaticI18n(){
  const dict = I18N[LANG] || I18N.ko;
  document.documentElement.lang = LANG;
  document.title = 'NH행운메이트 - ' + dict.hdrPageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if(dict[k] !== undefined) el.textContent = dict[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const k = el.getAttribute('data-i18n-placeholder');
    if(dict[k] !== undefined) el.placeholder = dict[k];
  });
}
applyStaticI18n();

function formatWonCompact(v){
  // 한국어는 Intl compact가 "4140.4만"처럼 어색하게 나와서 억/만 단위로 직접 끊는다
  if(LANG === 'ko'){
    if(v >= 1e8) return t('wonFmt', { v: (v / 1e8).toFixed(1).replace(/\.0$/, '') + '억' });
    if(v >= 1e4) return t('wonFmt', { v: Math.round(v / 1e4).toLocaleString('ko-KR') + '만' });
    return t('wonFmt', { v: Math.round(v).toLocaleString('ko-KR') });
  }
  let s;
  try { s = new Intl.NumberFormat(LOCALE_MAP[LANG] || 'en-US', { notation:'compact', maximumFractionDigits:1 }).format(v); }
  catch(e) { s = v.toLocaleString(); }
  return t('wonFmt', { v: s });
}
function formatDrawDate(ymd, opts){
  const y = +ymd.slice(0,4), m = +ymd.slice(4,6) - 1, d = +ymd.slice(6,8);
  try {
    return new Intl.DateTimeFormat(LOCALE_MAP[LANG] || 'ko-KR', opts || { year:'numeric', month:'long', day:'numeric' })
      .format(new Date(y, m, d));
  } catch(e) { return ymd; }
}

function ballColorClass(n){
  if(n<=10) return 'b-yellow';
  if(n<=20) return 'b-blue';
  if(n<=30) return 'b-red';
  if(n<=40) return 'b-gray';
  return 'b-green';
}
const NUMS = Array.from({ length: 45 }, (_, i) => i + 1);
const MY_NUM_KEY = 'nh_my_numbers';

const inlineToastTimers = new WeakMap();
function showInlineToast(el, msg){
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(inlineToastTimers.get(el));
  inlineToastTimers.set(el, setTimeout(() => { el.classList.remove('show'); }, 3200));
}

/* ===== 1. 고정 번호 선택 (최대 5개) ===== */
let fixedNumbers = [];

function renderFixedRow(){
  const wrap = document.getElementById('fixedBallsRow');
  wrap.innerHTML = '';
  fixedNumbers.slice().sort((a,b) => a-b).forEach(n => {
    const chip = document.createElement('div');
    chip.className = 'ball chip-ball ' + ballColorClass(n);
    chip.textContent = n;
    chip.addEventListener('click', () => {
      fixedNumbers = fixedNumbers.filter(x => x !== n);
      renderFixedRow();
      renderFixedSuggestions();
    });
    wrap.appendChild(chip);
  });
  for(let i = fixedNumbers.length; i < 5; i++){
    const e = document.createElement('div');
    e.className = 'ball chip-empty';
    wrap.appendChild(e);
  }
}

function renderFixedSuggestions(){
  const input = document.getElementById('fixedDigitInput');
  const wrap = document.getElementById('fixedSuggestRow');
  wrap.innerHTML = '';

  if(fixedNumbers.length >= 5){
    input.disabled = true;
    wrap.innerHTML = '<span class="suggest-msg">' + t('allFixedSelected') + '</span>';
    return;
  }
  input.disabled = false;

  const digits = input.value.replace(/[^0-9]/g, '');
  if(!digits) return;

  const candidates = NUMS.filter(n => !fixedNumbers.includes(n) && String(n).startsWith(digits));
  if(!candidates.length){
    const num = Number(digits);
    wrap.innerHTML = '<span class="suggest-msg">' +
      ((num >= 1 && num <= 45 && fixedNumbers.includes(num)) ? t('alreadySelected') : t('noMatch')) + '</span>';
    return;
  }
  candidates.forEach(n => {
    const b = document.createElement('div');
    b.className = 'ball suggest-ball ' + ballColorClass(n);
    b.textContent = n;
    b.addEventListener('click', () => {
      if(fixedNumbers.length >= 5 || fixedNumbers.includes(n)) return;
      fixedNumbers.push(n);
      input.value = '';
      renderFixedRow();
      renderFixedSuggestions();
      input.focus();
    });
    wrap.appendChild(b);
  });
}

document.getElementById('fixedDigitInput').addEventListener('input', renderFixedSuggestions);
document.getElementById('fixedDigitInput').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const digits = e.target.value.replace(/[^0-9]/g, '');
  const candidates = NUMS.filter(n => !fixedNumbers.includes(n) && String(n).startsWith(digits));
  if(candidates.length === 1 && fixedNumbers.length < 5){
    fixedNumbers.push(candidates[0]);
    e.target.value = '';
    renderFixedRow();
    renderFixedSuggestions();
  }
});

renderFixedRow();

/* ===== 뽑기 기계 애니메이션 + 번호 생성 ===== */
function generateNumbers(fixed){
  const result = new Set(fixed);
  while(result.size < 6){
    result.add(1 + Math.floor(Math.random() * 45));
  }
  return Array.from(result).sort((a, b) => a - b);
}

function renderResultBalls(containerId, numbers){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = numbers.map((n, i) => `
    <div class="ball ${ballColorClass(n)}" style="--pd:${i * 0.12}s">${n}</div>
  `).join('');
}

// 다른 화면(당첨조회 등)에 들렀다가 돌아와도 방금 뽑은 결과가 그대로 남아있도록 저장해둔다.
// 완전히 새로 뽑고 싶으면 "다시 뽑기"를 누르면 된다.
const DRAW_STATE_KEY = 'nh_draw_last_result';

function saveDrawState(result){
  try { localStorage.setItem(DRAW_STATE_KEY, JSON.stringify({ fixed: fixedNumbers, result })); } catch(e) {}
}

function showResult(result){
  renderResultBalls('drawResult', result);
  document.getElementById('drawActions').style.display = 'flex';
  document.getElementById('saveMyNumBtn').dataset.numbers = JSON.stringify(result);
}

let drawing = false;
document.getElementById('drawBtn').addEventListener('click', () => {
  if(drawing) return;
  drawing = true;
  const btn = document.getElementById('drawBtn');
  const dome = document.getElementById('machineDome');
  btn.classList.add('disabled');
  btn.textContent = t('drawBtnDrawing');
  dome.classList.add('spinning');
  document.getElementById('drawResult').innerHTML = '';
  document.getElementById('drawActions').style.display = 'none';

  setTimeout(() => {
    dome.classList.remove('spinning');
    const result = generateNumbers(fixedNumbers);
    showResult(result);
    saveDrawState(result);
    btn.classList.remove('disabled');
    btn.textContent = t('drawBtnIdle');
    drawing = false;
  }, 1300);
});

document.getElementById('redrawBtn').addEventListener('click', () => {
  document.getElementById('drawBtn').click();
});

// 페이지를 다시 열었을 때 마지막으로 뽑은 결과를 그대로 복원한다
(function restoreDrawState(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(DRAW_STATE_KEY) || 'null'); } catch(e) {}
  if(!saved || !Array.isArray(saved.result) || saved.result.length !== 6) return;
  fixedNumbers = Array.isArray(saved.fixed) ? saved.fixed : [];
  renderFixedRow();
  renderFixedSuggestions();
  showResult(saved.result);
})();

document.getElementById('saveMyNumBtn').addEventListener('click', (e) => {
  const numbers = JSON.parse(e.currentTarget.dataset.numbers || '[]');
  if(!numbers.length) return;
  try { localStorage.setItem(MY_NUM_KEY, JSON.stringify(numbers)); } catch(err) {}
  showInlineToast(document.getElementById('drawInlineToast'), t('toastSaved'));
});

/* ===== 2. 3등 당첨 챌린지 (역대 최다 출현 번호 기반 뽑기) =====
   3등은 6개 중 5개를 맞춰야 하므로, 실제 당첨번호 6개에 자주 포함된 번호일수록
   "3등이 될 뻔한 조합"에도 그만큼 자주 등장한 셈이다. 그래서 역대 전체 출현빈도
   TOP15 번호 풀에서 6개를 무작위로 뽑아 "3등 스타일" 조합을 만들어준다.
   (실제 당첨 확률을 높여주는 것은 아니며, 어디까지나 재미로 보는 통계 코너) */
const DH_API_URL = 'https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do?srchLtEpsd=all';
const CACHE_KEY = 'nh_dh645_cache_v2';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
const FALLBACK_DRAWS = [
  { r: 1180, d: '20260815', n: [3,11,19,27,33,41], b: 18, amt: [2000000000,60000000,1500000,50000,5000], cnt: [1,2,45,2200,35000] }
];

async function loadDrawData(){
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && Array.isArray(cached.list) && cached.list.length && (Date.now() - cached.t < CACHE_TTL_MS)){
      return cached.list;
    }
  } catch(e) {}
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(DH_API_URL, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const raw = (json.data && json.data.list) || [];
    const list = raw.map(d => ({
      r: d.ltEpsd, d: d.ltRflYmd,
      n: [d.tm1WnNo, d.tm2WnNo, d.tm3WnNo, d.tm4WnNo, d.tm5WnNo, d.tm6WnNo],
      b: d.bnsWnNo,
      amt: [d.rnk1WnAmt, d.rnk2WnAmt, d.rnk3WnAmt, d.rnk4WnAmt, d.rnk5WnAmt],
      cnt: [d.rnk1WnNope, d.rnk2WnNope, d.rnk3WnNope, d.rnk4WnNope, d.rnk5WnNope],
    })).sort((a, b) => a.r - b.r);
    if(!list.length) throw new Error('empty list');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), list })); } catch(e) {}
    return list;
  } catch(e) {
    console.warn('동행복권 API 연동 실패, 데모 데이터로 대체합니다:', e);
    return FALLBACK_DRAWS;
  }
}

/* ===== 3등 당첨 챌린지: 근접확률 계산기 + NH상품 투자비교 (재미로보는통계에서 이동) ===== */
let myNumbers = [];
try {
  const savedNum = JSON.parse(localStorage.getItem(MY_NUM_KEY) || 'null');
  if(Array.isArray(savedNum) && savedNum.length === 6 && savedNum.every(n => Number.isInteger(n) && n >= 1 && n <= 45)){
    myNumbers = savedNum;
  }
} catch(e) {}

function computeRank(nums, draw){
  const matched = nums.filter(n => draw.n.includes(n));
  const bonusMatched = nums.includes(draw.b);
  const c = matched.length;
  let rank = 0;
  if(c === 6) rank = 1;
  else if(c === 5 && bonusMatched) rank = 2;
  else if(c === 5) rank = 3;
  else if(c === 4) rank = 4;
  else if(c === 3) rank = 5;
  return { matched, cnt: c, rank, amount: rank > 0 ? draw.amt[rank - 1] : 0 };
}

function renderStatRow(containerId, items){
  document.getElementById(containerId).innerHTML = items.map(it =>
    `<div class="stat-item"><div class="num">${it.v}</div><div class="label">${it.l}</div></div>`
  ).join('');
}

const tooltipEl = document.getElementById('barTooltip');
function showTooltip(barEl, text){
  const phoneRect = document.querySelector('.phone').getBoundingClientRect();
  const barRect = barEl.getBoundingClientRect();
  tooltipEl.textContent = text;
  let x = barRect.left + barRect.width / 2 - phoneRect.left;
  x = Math.max(28, Math.min(phoneRect.width - 28, x));
  tooltipEl.style.left = x + 'px';
  tooltipEl.style.top = (barRect.top - phoneRect.top) + 'px';
  tooltipEl.classList.add('show');
}
function hideTooltip(){ tooltipEl.classList.remove('show'); }

function renderChallenge(list){
  const recent12 = list.slice(-12);
  const wrap = document.getElementById('chChart');
  wrap.innerHTML = '';
  const max = Math.max(...recent12.map(d => d.cnt[2]));
  recent12.forEach((d, i) => {
    const col = document.createElement('div');
    col.className = 'bar-col';

    bar.addEventListener('mouseenter', () => showTooltip(bar, d.r + ' · ' + d.cnt[2].toLocaleString() + t('unitPeople')));
    bar.addEventListener('mouseleave', hideTooltip);
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.textContent = d.r;
    col.appendChild(bar);
    col.appendChild(lb);
    wrap.appendChild(col);
  });

  const avgPrize = Math.round(recent12.reduce((a, d) => a + d.amt[2], 0) / recent12.length);
  const avgWinners = Math.round(recent12.reduce((a, d) => a + d.cnt[2], 0) / recent12.length);
  renderStatRow('chStats', [

    { v: avgWinners.toLocaleString() + t('unitPeople'), l: t('statAvgWinners') },
  ]);

  const latest = list[list.length - 1];
  const latestDate = new Date(+latest.d.slice(0,4), +latest.d.slice(4,6) - 1, +latest.d.slice(6,8));
  const nextDraw = new Date(latestDate.getTime() + 7 * 86400000);
  const daysLeft = Math.max(0, Math.ceil((nextDraw - new Date()) / 86400000));
  const nextYmd = nextDraw.getFullYear() +
    String(nextDraw.getMonth() + 1).padStart(2, '0') +
    String(nextDraw.getDate()).padStart(2, '0');

  document.getElementById('chHeroTitle').textContent = t('challengeHeroTpl', { round: latest.r + 1 });
  document.getElementById('chHeroSub').innerHTML = t('challengeDdayTpl', {
    date: formatDrawDate(nextYmd), days: '<b>' + daysLeft + '</b>',
  });

  renderNearMiss(latest);
  renderInvest();
}

const RANK3_NEED = 5; // 3등 = 6개 중 5개 일치
function comb(n, k){
  if(k < 0 || k > n) return 0;
  let r = 1;
  for(let i = 1; i <= k; i++) r = r * (n - k + i) / i;
  return r;
}
function rank3Probability(k){
  const need = RANK3_NEED - k;
  return comb(6 - k, need) * comb(39, (6 - k) - need) / comb(45 - k, 6 - k);
}

function renderNearMiss(latest){
  const box = document.getElementById('chNear');
  if(myNumbers.length !== 6){
    box.innerHTML = `<div class="near-box"><div class="near-p">${t('nearNoNum')}</div></div>`;
    return;
  }

  const { matched, rank } = computeRank(myNumbers, latest);
  const k = matched.length;

  if(rank >= 1 && rank <= 3){
    box.innerHTML = `<div class="near-box"><div class="near-t">${t('nearWin', { rank: t('rank' + rank) })}</div></div>`;
    return;
  }
  if(k < 2){
    box.innerHTML = `<div class="near-box"><div class="near-p">${t('nearFar')}</div></div>`;
    return;
  }

  const missing = latest.n.filter(n => !myNumbers.includes(n));
  const need = RANK3_NEED - k;
  const p = rank3Probability(k) * 100;

  box.innerHTML = `
    <div class="near-box">
      <div class="near-t">${t('nearTitleTpl', { n: `<b>${need}</b>` })}</div>
      <div class="near-balls">
        ${matched.slice().sort((a, b) => a - b).map(n => `<div class="mini ${ballColorClass(n)}">${n}</div>`).join('')}
        <span class="sep">+</span>
        ${missing.slice(0, need).map(n => `<div class="mini target ${ballColorClass(n)}">${n}</div>`).join('')}
      </div>
      <div class="near-p">${t('nearProbTpl', { k, n: need, p: `<b>${p.toFixed(2)}%</b>` })}</div>
    </div>`;
}

const infoPop = document.getElementById('infoPop');
function bindInfoMarks(){
  document.querySelectorAll('.info-mark').forEach(el => {
    const show = () => {
      const phoneRect = document.querySelector('.phone').getBoundingClientRect();
      const r = el.getBoundingClientRect();
      infoPop.textContent = el.getAttribute('data-tip');
      let x = r.left + r.width / 2 - phoneRect.left;
      x = Math.max(125, Math.min(phoneRect.width - 125, x));
      infoPop.style.left = x + 'px';
      infoPop.style.top = (r.top - phoneRect.top) + 'px';
      infoPop.classList.add('show');
    };
    const hide = () => infoPop.classList.remove('show');
    el.addEventListener('mouseenter', show);
    el.addEventListener('mouseleave', hide);
    el.addEventListener('click', (e) => { e.stopPropagation(); infoPop.classList.contains('show') ? hide() : show(); });
  });
}
document.addEventListener('click', () => infoPop.classList.remove('show'));

<script>
/* ===== 세금상담 AI챗봇 =====
   챗봇 자체는 별도로 구현해 붙일 예정이라, 아래 주소만 채우면 바로 연결된다.
   비어 있으면 안내 문구를 대신 보여준다. */
const CHATBOT_URL = '';
(function(){
  function chatT(key, fallback){
    try {
      const lang = localStorage.getItem('nh_lang') || 'ko';
      const dict = (typeof I18N !== 'undefined' && (I18N[lang] || I18N.ko)) || {};
      return dict[key] || fallback;
    } catch(e) { return fallback; }
  }

  const overlay = document.getElementById('chatOverlay');
  const body = document.getElementById('chatBody');
  let loaded = false;

  function openChat(){
    if(!loaded){
      const label = chatT('chatbotLabel', '세금상담 AI챗봇');
      body.innerHTML = CHATBOT_URL
        ? '<iframe src="' + CHATBOT_URL + '" title="' + label + '"></iframe>'
        : '<div class="chat-placeholder"><span class="ico">💬</span>' +
          chatT('chatbotPlaceholder', '세금상담 AI챗봇을 연결할 자리예요') + '</div>';
      loaded = true;
    }
    overlay.classList.add('show');
  }
  function closeChat(){ overlay.classList.remove('show'); }

  document.getElementById('chatFab').addEventListener('click', openChat);
  document.getElementById('chatClose').addEventListener('click', closeChat);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeChat(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeChat(); });
})();
</script>

<script>
/* ===== 큰글씨 보기(4060세대 접근성) — 전 화면 공통, localStorage로 유지 ===== */
(function(){
  var FONT_KEY = 'nh_fontsize';
  function isLarge(){ try { return localStorage.getItem(FONT_KEY) === 'large'; } catch(e){ return false; } }
  function applyFontSize(){
    var on = isLarge();
    document.body.classList.toggle('large-text', on);
    var btn = document.getElementById('fontSizeBtn');
    if(btn) btn.classList.toggle('active', on);
  }
  document.addEventListener('DOMContentLoaded', function(){
    applyFontSize();
    var btn = document.getElementById('fontSizeBtn');
    if(btn){
      btn.addEventListener('click', function(){
        try { localStorage.setItem(FONT_KEY, isLarge() ? 'normal' : 'large'); } catch(e){}
        applyFontSize();
      });
    }
  });
})();
</script>

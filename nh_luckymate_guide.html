<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>NH행운메이트 - 당첨자 행동요령 가이드</title>
<style>
  :root {
    --primary: #00A651;
    --primary-dark: #007A3D;
    --primary-light: #E7F7EE;
    --primary-light2: #F0FBF4;
    --primary-border: #CDEEDA;
    --danger: #FF7272;
    --text-main: #111;
    --text-sub: #555;
    --text-mute: #999;
    --text-faint: #aaa;
    --bg-page: #EDEFF1;
    --bg-content: #F7F8FA;
    --bg-card: #fff;
    --border-light: #eee;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: var(--bg-page);
    display:flex; justify-content:center; align-items:flex-start;
    padding: 40px 0;
  }
  a { text-decoration:none; color:inherit; }
  .phone {
    width: 390px;
    background: var(--bg-card);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 8px solid #1c1c1e;
    position: relative;
  }
  button { all:unset; box-sizing:border-box; cursor:pointer; }
  .statusbar {
    height: 30px; background: var(--bg-card);
    display:flex; justify-content:space-between; align-items:center;
    padding: 0 22px; font-size: 12px; font-weight:600; color:var(--text-main);
  }
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff; padding: 14px 18px 18px;
  }
  .header .top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .header .top .back { font-size:18px; }
  .header .top .title { font-size:16px; font-weight:700; }
  .header .top .dots { font-size:18px; letter-spacing:2px; }
  .header .sub { font-size: 18px; font-weight:800; line-height:1.35; }
  .header .sub span { font-weight:400; font-size:12.5px; display:block; margin-top:4px; opacity:0.9;}

  .content { padding: 16px; background:var(--bg-content); }

  .rank-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .rank-tabs div {
    flex:1; text-align:center; padding:10px 0; border-radius:12px;
    font-size:13px; font-weight:700; background:var(--bg-card); color:var(--text-mute);
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .rank-tabs .active { background:var(--primary); color:#fff; }

  .card {
    background:var(--bg-card); border-radius:16px; padding:16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 14px;
  }
  .card-title { font-size: 13px; font-weight:700; color:var(--text-sub); margin-bottom:12px; }

  .step-row {
    display:flex; gap:12px; padding:10px 0;
  }
  .step-row:not(:last-child) { border-bottom:1px solid var(--border-light); }
  .step-num {
    width:24px; height:24px; border-radius:50%; background:var(--primary-light);
    color:var(--primary-dark); font-size:12px; font-weight:800; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .step-body .title { font-size:13px; font-weight:700; color:var(--text-main); margin-bottom:3px; }
  .step-body .desc { font-size:11.5px; color:var(--text-mute); line-height:1.4; }

  .branch-card {
    background: linear-gradient(135deg,var(--primary-light2),var(--primary-light));
    border:1px solid var(--primary-border); border-radius:16px; padding:16px; margin-bottom:14px;
  }
  .branch-card .label { font-size:11.5px; color:var(--primary-dark); font-weight:700; margin-bottom:4px; }
  .branch-card .name { font-size:16px; font-weight:800; color:var(--text-main); margin-bottom:4px; }
  .branch-card .addr { font-size:11.5px; color:var(--text-mute); margin-bottom:12px; }
  .branch-card .btn-row { display:flex; gap:8px; }
  .branch-card .btn {
    flex:1; text-align:center; font-size:12px; font-weight:700; padding:9px 0;
    border-radius:10px; background:#fff; color:var(--primary-dark); border:1px solid var(--primary-border);
  }
  .branch-card .btn.solid { background:var(--primary); color:#fff; border:none; }

  .product-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0;
  }
  .product-row:not(:last-child) { border-bottom:1px solid var(--border-light); }
  .product-row .pname { font-size:12.5px; font-weight:700; color:var(--text-main); }
  .product-row .pdesc { font-size:10.5px; color:var(--text-mute); margin-top:2px; }
  .product-row .prate { font-size:13px; font-weight:800; color:var(--primary-dark); }

  .cta { display:block; background:var(--primary); color:#fff; text-align:center;
    padding:13px; border-radius:12px; font-size:14px; font-weight:700; }
  .badge-note { font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:8px; }

  .modal-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.45);
    display:none; align-items:center; justify-content:center; z-index:100; padding:0 30px;
  }
  .modal-overlay.show { display:flex; }
  .modal-box { width:100%; background:#fff; border-radius:16px; padding:22px 18px; text-align:center; }
  .modal-msg { font-size:13.5px; color:var(--text-main); line-height:1.5; margin-bottom:18px; }
  .modal-btns { display:flex; gap:8px; }
  .modal-btn { flex:1; padding:11px 0; border-radius:10px; font-size:13px; font-weight:700; text-align:center; }
  .modal-btn.cancel { background:var(--bg-content); color:var(--text-sub); }
  .modal-btn.confirm { background:var(--primary); color:#fff; }

  .tabbar {
    display:flex; border-top:1px solid var(--border-light); background:var(--bg-card); padding: 8px 0 14px;
  }
  .tabbar .tab { flex:1; text-align:center; font-size:10px; color:#bbb; }
  .tabbar .tab.active { color:var(--primary); font-weight:700; }
  .tabbar .tab .icon { font-size:18px; display:block; margin-bottom:3px; }
</style>
</head>

const LANG = localStorage.getItem('nh_lang') || 'ko';
const DICT = I18N[LANG] || I18N.ko;

(function(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(DICT[k] !== undefined) el.textContent = DICT[k];
  });
})();

/* ---- 등수별 절차·지급처·상품 렌더링 ----
   1등은 본점에서만, 2등은 전국 영업점, 3등 이하는 5만원 기준으로 판매점 수령이
   가능한 실제 지급 규정을 반영해 탭마다 다른 내용을 보여준다. */
function renderRank(idx){
  const r = (DICT.ranks || I18N.ko.ranks)[idx];

  document.getElementById('stepList').innerHTML = r.steps.map(([title, desc], i) => `
    <div class="step-row">
      <div class="step-num">${i + 1}</div>
      <div class="step-body">
        <div class="title">${title}</div>
        <div class="desc">${desc}</div>
      </div>
    </div>`).join('');

  document.getElementById('branchLabel').textContent = r.label;
  document.getElementById('branchName').textContent = r.name;
  document.getElementById('branchAddr').textContent = r.addr;
  // 카카오맵 길찾기: 별도 API 키 없이 카카오맵 웹 검색으로 실제 연결
  document.getElementById('btnMap').href =
    'https://map.kakao.com/link/search/' + encodeURIComponent(r.map);

  document.getElementById('productList').innerHTML = r.products.map(([name, desc, rate]) => `
    <div class="product-row">
      <div>
        <div class="pname">${name}</div>
        <div class="pdesc">${desc}</div>
      </div>
      <div class="prate">${rate}</div>
    </div>`).join('');
}

document.querySelectorAll('#rankTabs div').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#rankTabs div').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderRank(Number(tab.getAttribute('data-rank')));
  });
});

renderRank(0);

/* ---- 방문 예약하기: 실제 예약 페이지 연동 전까지 확인 팝업만 표시 ---- */
const modalOverlay = document.getElementById('modalOverlay');
document.getElementById('btnReserve').addEventListener('click', () => {
  modalOverlay.classList.add('show');
});
document.getElementById('modalCancelBtn').addEventListener('click', () => {
  modalOverlay.classList.remove('show');
});
document.getElementById('modalConfirmBtn').addEventListener('click', () => {
  modalOverlay.classList.remove('show');
});
</script>

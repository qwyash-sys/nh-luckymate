<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>NH행운메이트 - 당첨자 행동요령 가이드</title>
<style>
  :root {
    --primary: #00A651;
    --primary-dark: #007A3D;
    --primary-light: #E7F7EE;
    --primary-light2: #F0FBF4;
    --primary-border: #CDEEDA;
    --danger: #FF7272;
    --text-main: #111;
    --text-sub: #555;
    --text-mute: #999;
    --text-faint: #aaa;
    --bg-page: #EDEFF1;
    --bg-content: #F7F8FA;
    --bg-card: #fff;
    --border-light: #eee;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: var(--bg-page);
    display:flex; justify-content:center; align-items:flex-start;
    padding: 40px 0;
  }
  a { text-decoration:none; color:inherit; }
  .phone {
    width: 390px;
    background: var(--bg-card);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 8px solid #1c1c1e;
    position: relative;
  }
  button { all:unset; box-sizing:border-box; cursor:pointer; }
  .statusbar {
    height: 30px; background: var(--bg-card);
    display:flex; justify-content:space-between; align-items:center;
    padding: 0 22px; font-size: 12px; font-weight:600; color:var(--text-main);
  }
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff; padding: 14px 18px 18px;
  }
  .header .top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .header .top .back { font-size:18px; }
  .header .top .title { font-size:16px; font-weight:700; }
  .header .top .dots { display:flex; align-items:center; color:#fff; opacity:0.92; }
  .header .top .dots svg { width:20px; height:20px; display:block; }
  .header .sub { font-size: 18px; font-weight:800; line-height:1.35; }
  .header .sub span { font-weight:400; font-size:12.5px; display:block; margin-top:4px; opacity:0.9;}

  .content {
    padding: 16px; background:var(--bg-content);
    height: 600px; overflow-y: auto;
  }

  .rank-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .rank-tabs div {
    flex:1; text-align:center; padding:10px 0; border-radius:12px;
    font-size:13px; font-weight:700; background:var(--bg-card); color:var(--text-mute);
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .rank-tabs .active { background:var(--primary); color:#fff; }

  .card {
    background:var(--bg-card); border-radius:16px; padding:16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 14px;
  }
  .card-title { font-size: 13px; font-weight:700; color:var(--text-sub); margin-bottom:12px; }

  .step-row {
    display:flex; gap:12px; padding:10px 0;
  }
  .step-row:not(:last-child) { border-bottom:1px solid var(--border-light); }
  .step-num {
    width:24px; height:24px; border-radius:50%; background:var(--primary-light);
    color:var(--primary-dark); font-size:12px; font-weight:800; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .step-body .title { font-size:13px; font-weight:700; color:var(--text-main); margin-bottom:3px; }
  .step-body .desc { font-size:11.5px; color:var(--text-mute); line-height:1.4; }

  .branch-card {
    background: linear-gradient(135deg,var(--primary-light2),var(--primary-light));
    border:1px solid var(--primary-border); border-radius:16px; padding:16px; margin-bottom:14px;
  }
  .branch-card .label { font-size:11.5px; color:var(--primary-dark); font-weight:700; margin-bottom:4px; }
  .branch-card .name { font-size:16px; font-weight:800; color:var(--text-main); margin-bottom:4px; }
  .branch-card .addr { font-size:11.5px; color:var(--text-mute); margin-bottom:12px; }
  .branch-card .btn-row { display:flex; gap:8px; }
  .branch-card .btn {
    flex:1; text-align:center; font-size:12px; font-weight:700; padding:9px 0;
    border-radius:10px; background:#fff; color:var(--primary-dark); border:1px solid var(--primary-border);
  }
  .branch-card .btn.solid { background:var(--primary); color:#fff; border:none; }

  .product-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0;
  }
  .product-row:not(:last-child) { border-bottom:1px solid var(--border-light); }
  .product-row .pname { font-size:12.5px; font-weight:700; color:var(--text-main); }
  .product-row .pdesc { font-size:10.5px; color:var(--text-mute); margin-top:2px; }
  .product-row .prate { font-size:13px; font-weight:800; color:var(--primary-dark); white-space:nowrap; }
  .product-row .pearn { font-size:11.5px; font-weight:700; color:var(--primary-dark); margin-top:5px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .product-row .pearn .post { color:var(--text-sub); font-weight:600; }
  .product-row .pearn.sub { font-size:10.5px; font-weight:600; opacity:0.72; margin-top:2px; }
  .tax-badge {
    display:inline-block; margin-top:6px; font-size:9.5px; font-weight:700;
    padding:2px 7px; border-radius:20px; background:#EEF2F5; color:var(--text-sub);
  }
  .tax-badge.comp { background:#FFF1E2; color:#B25E00; }
  .tax-badge .caret { font-size:8px; margin-left:1px; display:inline-block; transition:transform .15s; }
  .tax-badge.open .caret { transform:rotate(180deg); }
  .tax-detail { display:none; margin-top:7px; background:#FAFBFC; border-radius:9px; padding:9px 10px; }
  .tax-detail.open { display:block; }
  .tax-row { display:flex; justify-content:space-between; gap:8px; font-size:10px; color:var(--text-sub); padding:3px 0; }
  .tax-row .tl { flex:1; }
  .tax-row .tv { white-space:nowrap; font-weight:700; color:var(--text-main); }
  .tax-row.head { color:var(--text-mute); border-bottom:1px solid var(--border-light); padding-bottom:5px; margin-bottom:3px; }
  .tax-row.total { border-top:1px solid var(--border-light); margin-top:4px; padding-top:5px; font-weight:800; }
  .tax-row.total .tl { font-weight:800; color:var(--text-main); }
  .tax-row.eff { color:var(--text-mute); }
  .tax-row.eff b { color:#B25E00; font-size:11px; }
  .prize-base {
    font-size:11.5px; font-weight:700; color:var(--text-sub);
    background:var(--primary-light2); border-radius:9px; padding:9px 11px; margin-bottom:6px;
  }
  .rate-note { font-size:10px; color:var(--text-faint); margin-top:9px; line-height:1.5; }
  .info-mark {
    display:inline-flex; align-items:center; justify-content:center;
    width:14px; height:14px; border-radius:50%; background:#C3CBD2; color:#fff;
    font-size:9.5px; font-weight:800; cursor:pointer; flex:none; font-style:normal;
  }
  .info-pop {
    position:absolute; left:0; top:0; transform:translate(-50%, calc(-100% - 8px));
    background:rgba(20,20,20,0.93); color:#fff; font-size:10.5px; font-weight:500;
    padding:8px 10px; border-radius:8px; width:230px; line-height:1.5; pointer-events:none;
    opacity:0; transition:opacity 0.12s ease; z-index:90;
  }
  .info-pop.show { opacity:1; }

  .cta { display:block; background:var(--primary); color:#fff; text-align:center;
    padding:13px; border-radius:12px; font-size:14px; font-weight:700; }
  .badge-note { font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:8px; }

  .modal-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.45);
    display:none; align-items:center; justify-content:center; z-index:100; padding:0 30px;
  }
  .modal-overlay.show { display:flex; }
  .modal-box { width:100%; background:#fff; border-radius:16px; padding:22px 18px; text-align:center; }
  .modal-msg { font-size:13.5px; color:var(--text-main); line-height:1.5; margin-bottom:18px; }
  .modal-btns { display:flex; gap:8px; }
  .modal-btn { flex:1; padding:11px 0; border-radius:10px; font-size:13px; font-weight:700; text-align:center; }
  .modal-btn.cancel { background:var(--bg-content); color:var(--text-sub); }
  .modal-btn.confirm { background:var(--primary); color:#fff; }

  .tabbar {
    display:flex; border-top:1px solid var(--border-light); background:var(--bg-card); padding: 8px 0 14px;
  }
  .tabbar .tab { flex:1; text-align:center; font-size:10px; color:#bbb; }
  .tabbar .tab.active { color:var(--primary); font-weight:700; }
  .tabbar .tab .icon { font-size:18px; display:block; margin-bottom:3px; }

  /* ===== 세금상담 AI챗봇 ===== */
  .chat-fab, .chat-close { all:unset; box-sizing:border-box; cursor:pointer; }
  .chat-fab {
    position:absolute; right:16px; bottom:74px; z-index:60;
    width:50px; height:50px; border-radius:50%;
    background:linear-gradient(135deg,#0BBF63,#00893F);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,122,61,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .chat-fab:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,122,61,0.45); }
  .chat-fab svg { width:24px; height:24px; display:block; }
  .chat-fab .tip {
    position:absolute; right:58px; top:50%; transform:translateY(-50%);
    background:rgba(20,20,20,0.92); color:#fff; font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .chat-fab:hover .tip { opacity:1; }

  .chat-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.45);
    display:none; z-index:130; padding:10px;
  }
  .chat-overlay.show { display:block; }
  .chat-panel {
    width:100%; height:100%; background:#fff; border-radius:18px;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .chat-close {
    position:absolute; top:10px; right:10px; z-index:2;
    width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.07);
    color:var(--text-sub); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-close:hover { background:rgba(0,0,0,0.12); }
  .chat-body { flex:1; display:flex; align-items:center; justify-content:center; }
  .chat-body iframe { width:100%; height:100%; border:0; }
  .chat-placeholder { text-align:center; color:var(--text-mute); font-size:12px; line-height:1.75; padding:0 26px; }
  .chat-placeholder .ico { font-size:30px; display:block; margin-bottom:12px; opacity:.45; }
</style>
</head>

<div class="phone">

/* ===== 당첨금으로 NH 상품에 넣으면 이자가 얼마인지 =====
   금리는 2026-09-23 은행연합회 비교공시·NH금융상품몰 기준(세전, 12개월). */
/* ===== 이자소득 세금 =====
   연 금융소득이 2,000만원 이하면 15.4% 분리과세로 끝난다.
   2,000만원을 넘으면 초과분이 다른 소득과 합산돼 종합소득세 누진세율을 타므로,
   1등 당첨금처럼 이자가 큰 경우 실효세율이 15.4%보다 훨씬 높아진다.
   (다른 소득이 없고 각종 공제를 반영하지 않은 단순 계산) */
const SEPARATE_TAX = 0.154;        // 이자소득세 14% + 지방소득세 1.4%
const FIN_THRESHOLD = 20000000;    // 금융소득 종합과세 기준금액
const WITHHOLDING = 0.14;          // 기준금액까지 적용되는 원천징수 소득세율
const LOCAL_TAX = 0.1;             // 지방소득세 = 소득세의 10%
const INCOME_BRACKETS = [          // 종합소득세 과세표준 구간
  { upTo: 14000000,   rate: 0.06 },
  { upTo: 50000000,   rate: 0.15 },
  { upTo: 88000000,   rate: 0.24 },
  { upTo: 150000000,  rate: 0.35 },
  { upTo: 300000000,  rate: 0.38 },
  { upTo: 500000000,  rate: 0.40 },
  { upTo: 1000000000, rate: 0.42 },
  { upTo: Infinity,   rate: 0.45 },
];

/** 만/억 단위로 끊어 읽기 쉽게 (과표 구간 표기에 사용) */
function shortWon(v){
  if(v >= 1e8) return fmt(DICT.unitEok, { v: +(v / 1e8).toFixed(1) });
  if(v >= 1e4) return fmt(DICT.unitMan, { v: Math.round(v / 1e4).toLocaleString('ko-KR') });
  return Math.round(v).toLocaleString('ko-KR');
}

/**
 * 연 이자소득에 대한 세금을 계산하고, 어떤 과표 구간이 어떻게 적용됐는지도 함께 돌려준다.
 * breakdown의 각 항목: { label, base, rate, amount }
 */
function taxOnInterest(annualInterest){
  if(annualInterest <= FIN_THRESHOLD){
    const amount = annualInterest * SEPARATE_TAX;
    return {
      tax: amount, comprehensive: false,
      breakdown: [{ label: DICT.taxRowSeparate, amount }],
    };
  }

  const rows = [];
  let incomeTax = FIN_THRESHOLD * WITHHOLDING;
  rows.push({
    label: fmt(DICT.taxRowWithholdTpl, { cap: shortWon(FIN_THRESHOLD), r: (WITHHOLDING * 100).toFixed(0) }),
    amount: incomeTax,
  });

  let remaining = annualInterest - FIN_THRESHOLD;
  let prev = 0;
  for(const b of INCOME_BRACKETS){
    const span = Math.min(remaining, b.upTo - prev);
    if(span > 0){
      const amount = span * b.rate;
      incomeTax += amount;
      const range = prev === 0
        ? fmt(DICT.taxRangeUnder, { to: shortWon(b.upTo) })
        : (b.upTo === Infinity
            ? fmt(DICT.taxRangeOver, { from: shortWon(prev) })
            : fmt(DICT.taxRangeBetween, { from: shortWon(prev), to: shortWon(b.upTo) }));
      rows.push({
        label: fmt(DICT.taxRowBracketTpl, { range, r: (b.rate * 100).toFixed(0) }),
        base: span, amount,
      });
      remaining -= span;
    }
    prev = b.upTo;
    if(remaining <= 0) break;
  }

  const local = incomeTax * LOCAL_TAX;
  rows.push({ label: fmt(DICT.taxRowLocal, { r: (LOCAL_TAX * 100).toFixed(0) }), amount: local });

  return { tax: incomeTax + local, comprehensive: true, breakdown: rows };
}

const RANK_PRIZE_IDX = [0, 1, 2]; // 1등 / 2등 / 3등

/* 2026-09-23 은행연합회 비교공시 기준, 12개월·세전.
   cap은 상품별 1계좌 한도(공시 없으면 null). */
const PRODUCTS = [
  { key: 'waltz',  name: 'NH왈츠회전예금 II',  rate: 0.0345, type: 'deposit', cap: null },
  { key: 'onee',   name: 'NH올원e예금',        rate: 0.0355, type: 'deposit', cap: 1000000000 },

];

let LATEST_DRAW = null;

function won(v){ return Math.round(v).toLocaleString('ko-KR'); }

function renderProducts(rankIdx){
  const wrap = document.getElementById('productList');
  if(!LATEST_DRAW){
    wrap.innerHTML = `<div class="pdesc">${DICT.loadingText || '불러오는 중...'}</div>`;
    return;
  }

  const prize = LATEST_DRAW.amt[RANK_PRIZE_IDX[rankIdx]];
  const rankName = [DICT.rank1, DICT.rank2, DICT.rank3plus][rankIdx];

  let anyComprehensive = false;

  const earnBlock = (yearPre) => {
    const { tax, comprehensive, breakdown } = taxOnInterest(yearPre);
    if(comprehensive) anyComprehensive = true;
    const yearPost = yearPre - tax;
    const rate = yearPre > 0 ? (tax / yearPre * 100).toFixed(1) : '0.0';
    // 적용된 과세 방식에 맞는 설명을 붙인다(일반과세 vs 종합과세)
    const info = `<i class="info-mark" data-tip="${
      comprehensive ? DICT.taxTooltipComp : DICT.taxTooltipSep
    }">i</i>`;

    // 실효세율이 어떻게 나온 값인지 과표 구간별로 펼쳐 보여준다
    const rows = breakdown.map(r => `
      <div class="tax-row">
        <span class="tl">${r.label}</span>
        <span class="tv">${won(r.amount)}${DICT.wonUnit}</span>
      </div>`).join('');

    return `
      <div class="pearn">
        ${fmt(DICT.yearlyPreTpl, { v: won(yearPre) })}
        <span class="post">${fmt(DICT.yearlyPostTpl, { v: won(yearPost) })}</span>${info}
      </div>
      <div class="pearn sub">
        ${fmt(DICT.monthlyPreTpl, { v: won(yearPre / 12) })}
        <span class="post">${fmt(DICT.monthlyPostTpl, { v: won(yearPost / 12) })}</span>
      </div>
      <button class="tax-badge ${comprehensive ? 'comp' : ''}" data-tax-toggle>${
        comprehensive ? fmt(DICT.taxComprehensive, { r: rate }) : fmt(DICT.taxSeparate, { r: rate })
      } <span class="caret">▾</span></button>
      <div class="tax-detail">
        <div class="tax-row head">
          <span class="tl">${fmt(DICT.taxDetailBase, { v: won(yearPre) })}</span>
        </div>
        ${rows}
        <div class="tax-row total">
          <span class="tl">${DICT.taxRowTotal}</span>
          <span class="tv">${won(tax)}${DICT.wonUnit}</span>
        </div>
        <div class="tax-row eff">
          <span class="tl">${DICT.taxRowEffective}</span>
          <span class="tv">${won(tax)} ÷ ${won(yearPre)} = <b>${rate}%</b></span>
        </div>
      </div>`;
  };

  const rows = PRODUCTS.map(p => {
    let cond, yearPre;
    if(p.type === 'deposit'){
      // 당첨금 전액을 이 금리로 굴렸을 때로 계산한다.
      // 1계좌 한도가 있는 상품은 실제로 나눠 담아야 하므로 그 점을 함께 알린다.
      yearPre = prize * p.rate;
      const needsSplit = p.cap && prize > p.cap;
      cond = fmt(DICT.depositCond, { amount: won(prize) }) +
        (needsSplit ? ' · ' + fmt(DICT.splitNote, { cap: won(p.cap) }) : '');
    } else {
      // 적금은 매월 납입이라 한도를 넘을 수 없다. 당첨금을 12개월로 나눠 붓는 기준.
      const need = Math.floor(prize / 12);
      const monthly = Math.min(need, p.cap);
      // 1회차 12개월치 … 12회차 1개월치 → 평균 6.5개월치 이자
      yearPre = monthly * p.rate * 6.5;
      cond = fmt(DICT.savingCond, { amount: won(monthly) }) +
        (need > p.cap ? '<br>' + fmt(DICT.savingCapNote, { need: won(need), cap: won(p.cap) }) : '');
    }
    return `
      <div class="product-row">
        <div>
          <div class="pname">${p.name}</div>
          <div class="pdesc">${cond}</div>
          ${earnBlock(yearPre)}
        </div>
        <div class="prate">${fmt(DICT.rateTpl, { r: (p.rate * 100).toFixed(2) })}</div>
      </div>`;
  }).join('');

  wrap.innerHTML =
    `<div class="prize-base">${fmt(DICT.prizeBaseTpl, { round: LATEST_DRAW.r, rank: rankName, amount: won(prize) })}</div>` +
    rows +
    `<div class="rate-note">${DICT.rateNote}${anyComprehensive ? '<br>' + DICT.compNote : ''}</div>`;
  bindInfoMarks();
  bindTaxToggles();
}

function fmt(tpl, vars){
  let s = tpl || '';
  Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}

}

/* ===== 동행복권 최신 회차 당첨금 (다른 화면과 캐시 공유) ===== */
const DH_API_URL = 'https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do?srchLtEpsd=all';
const CACHE_KEY = 'nh_dh645_cache_v2';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
const FALLBACK_DRAW = { r: 1180, amt: [2000000000, 60000000, 1500000, 50000, 5000] };

async function loadLatestDraw(){
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && Array.isArray(cached.list) && cached.list.length && (Date.now() - cached.t < CACHE_TTL_MS)){
      return cached.list[cached.list.length - 1];
    }
  } catch(e) {}
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(DH_API_URL, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const raw = (json.data && json.data.list) || [];
    const list = raw.map(d => ({
      r: d.ltEpsd, d: d.ltRflYmd,
      n: [d.tm1WnNo, d.tm2WnNo, d.tm3WnNo, d.tm4WnNo, d.tm5WnNo, d.tm6WnNo],
      b: d.bnsWnNo,
      amt: [d.rnk1WnAmt, d.rnk2WnAmt, d.rnk3WnAmt, d.rnk4WnAmt, d.rnk5WnAmt],
      cnt: [d.rnk1WnNope, d.rnk2WnNope, d.rnk3WnNope, d.rnk4WnNope, d.rnk5WnNope],
    })).sort((a, b) => a.r - b.r);
    if(!list.length) throw new Error('empty list');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), list })); } catch(e) {}
    return list[list.length - 1];
  } catch(e) {
    console.warn('동행복권 API 연동 실패, 데모 데이터로 대체합니다:', e);
    return FALLBACK_DRAW;
  }
}

        ? '<iframe src="' + CHATBOT_URL + '" title="' + label + '"></iframe>'
        : '<div class="chat-placeholder"><span class="ico">💬</span>' +
          chatT('chatbotPlaceholder', '세금상담 AI챗봇을 연결할 자리예요') + '</div>';
      loaded = true;
    }
    overlay.classList.add('show');
  }
  function closeChat(){ overlay.classList.remove('show'); }

  document.getElementById('chatFab').addEventListener('click', openChat);
  document.getElementById('chatClose').addEventListener('click', closeChat);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeChat(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeChat(); });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>NH행운메이트 - 실수령액 계산</title>
<style>
  :root {
    --primary: #00A651;
    --primary-dark: #007A3D;
    --primary-light: #E7F7EE;
    --primary-light2: #F0FBF4;
    --primary-border: #CDEEDA;
    --danger: #FF7272;
    --text-main: #111;
    --text-sub: #555;
    --text-mute: #999;
    --text-faint: #aaa;
    --bg-page: #EDEFF1;
    --bg-content: #F7F8FA;
    --bg-card: #fff;
    --border-light: #eee;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: var(--bg-page);
    display:flex; justify-content:center; align-items:flex-start;
    padding: 40px 0;
  }
  a { text-decoration:none; color:inherit; }
  .phone {
    width: 390px;
    background: var(--bg-card);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 8px solid #1c1c1e;
    position: relative;
  }
  .statusbar {
    height: 30px; background: var(--bg-card);
    display:flex; justify-content:space-between; align-items:center;
    padding: 0 22px; font-size: 12px; font-weight:600; color:var(--text-main);
  }
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff; padding: 14px 18px 18px;
  }
  .header .top {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .header .top .back { font-size:18px; }
  .header .top .title { font-size:16px; font-weight:700; }
  .header .top .dots { display:flex; align-items:center; color:#fff; opacity:0.92; }
  .header .top .dots svg { width:20px; height:20px; display:block; }
  .header .sub { font-size: 18px; font-weight:800; line-height:1.35; }
  .header .sub span { font-weight:400; font-size:12.5px; display:block; margin-top:4px; opacity:0.9;}

  .content {
    padding: 16px; background:var(--bg-content);
    height: 600px; overflow-y: auto;
  }

  .rank-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .rank-tabs div {
    flex:1; text-align:center; padding:9px 0; border-radius:12px; cursor:pointer;
    font-size:12px; font-weight:700; background:var(--bg-card); color:var(--text-mute);
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .rank-tabs .active { background:var(--primary); color:#fff; }

  .card {
    background:var(--bg-card); border-radius:16px; padding:18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 14px;
  }
  .card-label { font-size:12px; color:var(--text-mute); font-weight:600; margin-bottom:6px; }
  .gross {
    font-size: 26px; font-weight:800; color:var(--text-main); margin-bottom:2px;
  }
  .gross span { font-size:14px; font-weight:600; color:var(--text-mute); }
  .round-info { font-size:11px; color:var(--text-faint); }

  .divider { height:1px; background:var(--border-light); margin:16px 0; }

  .calc-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0; font-size:13px;
  }
  .calc-row .label { color:#777; }
  .calc-row .value { color:#333; font-weight:600; }
  .calc-row .minus { color:var(--danger); font-weight:700; }

  .result-card {
    background: linear-gradient(135deg,var(--primary-light2),var(--primary-light));
    border:1px solid var(--primary-border); border-radius:16px; padding:18px;
    text-align:center; margin-bottom:14px;
  }
  .result-card .label { font-size:12.5px; color:var(--primary-dark); font-weight:700; margin-bottom:6px;}
  .result-card .value { font-size:28px; font-weight:900; color:var(--primary-dark); }
  .result-card .note { font-size:10.5px; color:#5fa885; margin-top:6px; }

  .input-row {
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-content); border-radius:10px; padding:10px 14px; margin-top:10px;
  }
  .input-row .label { font-size:12.5px; color:#777; }
  .input-row .stepper { display:flex; align-items:center; gap:10px; }
  .input-row .stepper button {
    width:24px; height:24px; border-radius:50%; border:1px solid #ddd;
    background:#fff; color:var(--primary); font-weight:700; font-size:14px;
  }
  .input-row .stepper .n { font-size:14px; font-weight:700; width:24px; text-align:center; }

  .cta {
    display:block;
    background:var(--primary); color:#fff; text-align:center;
    padding:13px; border-radius:12px; font-size:14px; font-weight:700;
  }
  .badge-note { font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:8px; }

  .tabbar {
    display:flex; border-top:1px solid var(--border-light); background:var(--bg-card); padding: 8px 0 14px;
  }
  .tabbar .tab { flex:1; text-align:center; font-size:10px; color:#bbb; }
  .tabbar .tab.active { color:var(--primary); font-weight:700; }
  .tabbar .tab .icon { font-size:18px; display:block; margin-bottom:3px; }

  /* ===== 세금상담 AI챗봇 ===== */
  .chat-fab, .chat-close { all:unset; box-sizing:border-box; cursor:pointer; }
  .chat-fab {
    position:absolute; right:16px; bottom:74px; z-index:60;
    width:50px; height:50px; border-radius:50%;
    background:linear-gradient(135deg,#0BBF63,#00893F);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,122,61,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .chat-fab:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,122,61,0.45); }
  .chat-fab svg { width:24px; height:24px; display:block; }
  .chat-fab .tip {
    position:absolute; right:58px; top:50%; transform:translateY(-50%);
    background:rgba(20,20,20,0.92); color:#fff; font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .chat-fab:hover .tip { opacity:1; }

  .chat-overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.45);
    display:none; z-index:130; padding:10px;
  }
  .chat-overlay.show { display:block; }
  .chat-panel {
    width:100%; height:100%; background:#fff; border-radius:18px;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .chat-close {
    position:absolute; top:10px; right:10px; z-index:2;
    width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.07);
    color:var(--text-sub); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-close:hover { background:rgba(0,0,0,0.12); }
  .chat-body { flex:1; display:flex; align-items:center; justify-content:center; }
  .chat-body iframe { width:100%; height:100%; border:0; }
  .chat-placeholder { text-align:center; color:var(--text-mute); font-size:12px; line-height:1.75; padding:0 26px; }
  .chat-placeholder .ico { font-size:30px; display:block; margin-bottom:12px; opacity:.45; }
</style>

function currentDict(){

}
function applyStaticI18n(){

  document.documentElement.lang = lang;

/* ===== 동행복권 실시간 데이터로 등수별 실수령액 계산 (mockup.html과 캐시 공유) ===== */
const DH_API_URL = 'https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do?srchLtEpsd=all';
const CACHE_KEY = 'nh_dh645_cache_v2';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
const FALLBACK_DRAWS = [
  { r: 1180, d: '20260815', n: [3,11,19,27,33,41], b: 18, amt: [2000000000,60000000,1500000,50000,5000], cnt: [1,2,45,2200,35000] }
];

async function loadDrawData(){
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && Array.isArray(cached.list) && cached.list.length && (Date.now() - cached.t < CACHE_TTL_MS)){
      return { list: cached.list };
    }
  } catch(e) {}
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000); // 동행복권 응답이 7초를 넘는 경우가 있어 여유를 둠
    const res = await fetch(DH_API_URL, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const raw = (json.data && json.data.list) || [];
    const list = raw.map(d => ({
      r: d.ltEpsd, d: d.ltRflYmd,
      n: [d.tm1WnNo, d.tm2WnNo, d.tm3WnNo, d.tm4WnNo, d.tm5WnNo, d.tm6WnNo],
      b: d.bnsWnNo,
      amt: [d.rnk1WnAmt, d.rnk2WnAmt, d.rnk3WnAmt, d.rnk4WnAmt, d.rnk5WnAmt],
      cnt: [d.rnk1WnNope, d.rnk2WnNope, d.rnk3WnNope, d.rnk4WnNope, d.rnk5WnNope],
    })).sort((a, b) => a.r - b.r);
    if(!list.length) throw new Error('empty list');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), list })); } catch(e) {}
    return { list };
  } catch(e) {
    console.warn('동행복권 API 연동 실패, 데모 데이터로 대체합니다:', e);
    return { list: FALLBACK_DRAWS };
  }
}

let ALL_DRAWS = [];
let activeDraw = null;
let selectedRank = 1;
let isPersonalResult = false;

function taxBreakdown(gross){
  const incomeTax = Math.round(gross * 0.20);
  const localTax = Math.round(gross * 0.02);
  const totalTax = incomeTax + localTax;
  return { incomeTax, localTax, totalTax, net: gross - totalTax };
}

function render(){
  const dict = currentDict();
  const draw = activeDraw;
  const gross = draw.amt[selectedRank - 1];
  const winnerCount = draw.cnt[selectedRank - 1];
  const rankLabel = dict['rank' + selectedRank];

  document.getElementById('grossLabel').textContent = dict.grossLabelTpl.replace('{rank}', rankLabel);
  document.getElementById('grossAmount').innerHTML = gross.toLocaleString() + '<span>원</span>';
  const isFixedRank = selectedRank >= 4;
  const roundInfoTpl = isFixedRank
    ? (isPersonalResult ? dict.roundInfoPersonalFixed : dict.roundInfoExampleFixed)
    : (isPersonalResult ? dict.roundInfoPersonal : dict.roundInfoExample);
  document.getElementById('roundInfo').textContent = roundInfoTpl
    .replace('{round}', draw.r).replace('{rank}', rankLabel).replace('{count}', winnerCount.toLocaleString());

  if(selectedRank <= 3){
    document.getElementById('taxCard').style.display = '';
    document.getElementById('fixedNoticeCard').style.display = 'none';
    const { incomeTax, localTax, totalTax, net } = taxBreakdown(gross);
    document.getElementById('calcGross').textContent = gross.toLocaleString() + '원';
    document.getElementById('calcIncomeTax').textContent = '- ' + incomeTax.toLocaleString() + '원';
    document.getElementById('calcLocalTax').textContent = '- ' + localTax.toLocaleString() + '원';
    document.getElementById('calcTotalTax').textContent = '- ' + totalTax.toLocaleString() + '원';
    document.getElementById('finalAmount').textContent = net.toLocaleString() + '원';
    document.getElementById('finalNote').textContent = dict.finalNoteVariable;
  } else {
    document.getElementById('taxCard').style.display = 'none';
    document.getElementById('fixedNoticeCard').style.display = '';
    document.getElementById('fixedDesc').textContent = dict.fixedDesc.replace('{rank}', rankLabel);
    document.getElementById('finalAmount').textContent = gross.toLocaleString() + '원';
    document.getElementById('finalNote').textContent = dict.finalNoteFixed;
  }

  renderDepositNote(
    selectedRank <= 3 ? taxBreakdown(gross).net : gross
  );
}

/* ===== 실수령액을 예금에 넣으면 이자가 얼마인지 =====
   기존에는 "정기예금 3.2% 가입 시 연 158만원"이라는 고정 문구여서 실제 금액과
   전혀 맞지 않았다. 실수령액으로 직접 계산하고, 이자가 커지면 금융소득
   종합과세까지 반영한다. 금리는 2026-09-23 공시 기준(NH올원e예금, 세전). */
const DEPOSIT_RATE = 0.0355;
const SEPARATE_TAX = 0.154;      // 이자소득세 14% + 지방소득세 1.4%
const FIN_THRESHOLD = 20000000;  // 금융소득 종합과세 기준금액
const WITHHOLDING = 0.14;
const LOCAL_TAX = 0.1;
const INCOME_BRACKETS = [
  { upTo: 14000000, rate: 0.06 }, { upTo: 50000000, rate: 0.15 },
  { upTo: 88000000, rate: 0.24 }, { upTo: 150000000, rate: 0.35 },
  { upTo: 300000000, rate: 0.38 }, { upTo: 500000000, rate: 0.40 },
  { upTo: 1000000000, rate: 0.42 }, { upTo: Infinity, rate: 0.45 },
];

function interestTax(annual){
  if(annual <= FIN_THRESHOLD) return { tax: annual * SEPARATE_TAX, comprehensive: false };
  let incomeTax = FIN_THRESHOLD * WITHHOLDING;
  let remaining = annual - FIN_THRESHOLD, prev = 0;
  for(const b of INCOME_BRACKETS){
    const span = Math.min(remaining, b.upTo - prev);
    if(span > 0){ incomeTax += span * b.rate; remaining -= span; }
    prev = b.upTo;
    if(remaining <= 0) break;
  }
  return { tax: incomeTax * (1 + LOCAL_TAX), comprehensive: true };
}

function renderDepositNote(principal){
  const dict = currentDict();
  const annual = principal * DEPOSIT_RATE;
  const { tax, comprehensive } = interestTax(annual);
  const won = (v) => Math.round(v).toLocaleString();
  document.getElementById('depositNote').textContent = (comprehensive ? dict.depositNoteComp : dict.depositNote)
    .replace('{rate}', (DEPOSIT_RATE * 100).toFixed(2))
    .replace('{pre}', won(annual))
    .replace('{post}', won(annual - tax));
}

document.querySelectorAll('#rankTabs div').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('#rankTabs div').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    selectedRank = Number(el.getAttribute('data-rank'));
    render();
  });
});

async function init(){
  document.getElementById('grossLabel').textContent = currentDict().loadingText;

  const { list } = await loadDrawData();
  ALL_DRAWS = list;

  let personal = null;
  try { personal = JSON.parse(localStorage.getItem('nh_last_check_result') || 'null'); } catch(e) {}

  if(personal && personal.rank >= 1 && personal.rank <= 5){
    const idx = ALL_DRAWS.findIndex(d => d.r === personal.round);
    if(idx >= 0){
      activeDraw = ALL_DRAWS[idx];
      selectedRank = personal.rank;
      isPersonalResult = true;
    }
  }
  if(!activeDraw){
    activeDraw = ALL_DRAWS[ALL_DRAWS.length - 1];
    selectedRank = 1;
    isPersonalResult = false;
  }

  document.querySelectorAll('#rankTabs div').forEach(el => {
    el.classList.toggle('active', Number(el.getAttribute('data-rank')) === selectedRank);
  });

  render();
}

init();
</script>


<script>
/* ===== 세금상담 AI챗봇 =====
   챗봇 자체는 별도로 구현해 붙일 예정이라, 아래 주소만 채우면 바로 연결된다.
   비어 있으면 안내 문구를 대신 보여준다. */
const CHATBOT_URL = '';
(function(){
  function chatT(key, fallback){
    try {
      const lang = localStorage.getItem('nh_lang') || 'ko';
      const dict = (typeof I18N !== 'undefined' && (I18N[lang] || I18N.ko)) || {};
      return dict[key] || fallback;
    } catch(e) { return fallback; }
  }

  const overlay = document.getElementById('chatOverlay');
  const body = document.getElementById('chatBody');
  let loaded = false;

  function openChat(){
    if(!loaded){
      const label = chatT('chatbotLabel', '세금상담 AI챗봇');
      body.innerHTML = CHATBOT_URL
        ? '<iframe src="' + CHATBOT_URL + '" title="' + label + '"></iframe>'
        : '<div class="chat-placeholder"><span class="ico">💬</span>' +
          chatT('chatbotPlaceholder', '세금상담 AI챗봇을 연결할 자리예요') + '</div>';
      loaded = true;
    }
    overlay.classList.add('show');
  }
  function closeChat(){ overlay.classList.remove('show'); }

  document.getElementById('chatFab').addEventListener('click', openChat);
  document.getElementById('chatClose').addEventListener('click', closeChat);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeChat(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeChat(); });
})();
</script>

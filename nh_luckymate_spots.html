function getUserLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){
      resolve({ lat: FALLBACK_LAT, lon: FALLBACK_LON, isFallback: true });
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, isFallback: false }),
      () => resolve({ lat: FALLBACK_LAT, lon: FALLBACK_LON, isFallback: true }),
      { timeout: 5000, maximumAge: 300000 }
    );
  });
}

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDist(km){
  if(km < 1) return Math.round(km * 1000) + 'm';
  return km.toFixed(1) + 'km';
}

const CACHE_KEY = 'nh_dh645_cache_v2';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
// API 연동 실패 시 폴백용 대략적인 평균 당첨금(과거 관측치 기준)

async function loadAvgPrizeAmounts(){
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && Array.isArray(cached.list) && cached.list.length && (Date.now() - cached.t < CACHE_TTL_MS)){
      return computeAvg(cached.list);
    }
  } catch(e) {}
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000); // 동행복권 응답이 7초를 넘는 경우가 있어 여유를 둠
    const res = await fetch(DH_API_URL, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const raw = (json.data && json.data.list) || [];
    const list = raw.map(d => ({
      r: d.ltEpsd,
      amt: [d.rnk1WnAmt, d.rnk2WnAmt, d.rnk3WnAmt, d.rnk4WnAmt, d.rnk5WnAmt],
    })).sort((a, b) => a.r - b.r);
    if(!list.length) throw new Error('empty list');
    return computeAvg(list);
  } catch(e) {
    console.warn('평균 당첨금 계산용 API 연동 실패, 기본값 사용:', e);
    return FALLBACK_AVG;
  }
}
function computeAvg(list){
  const recent = list.slice(-100);
  const avg1 = recent.reduce((a, d) => a + d.amt[0], 0) / recent.length;
  const avg2 = recent.reduce((a, d) => a + d.amt[1], 0) / recent.length;
  return { rank1: avg1, rank2: avg2 };
}
function formatWon(amount){
  const eok = amount / 100000000; // 억 단위
  if(eok >= 1) return eok.toFixed(1) + '억원';
  return Math.round(amount / 10000) + '만원';
}

let ALL_SHOPS = [];
let AVG_PRIZE = FALLBACK_AVG;
let currentMode = 'dist';

function renderShops(mode){
  currentMode = mode;
  const wrap = document.getElementById('shopList');
  if(ALL_SHOPS.length === 0){
    wrap.innerHTML = `<div class="status-text">${t('emptyText')}</div>`;
    return;
  }

  const sorted = ALL_SHOPS.slice().sort((a, b) => {
    if(mode === 'count') {
      if(b.rank1_count !== a.rank1_count) return b.rank1_count - a.rank1_count;
      return b.rank2_count - a.rank2_count;
    }
    if(mode === 'amount') return b.estAmount - a.estAmount;
    return a.distKm - b.distKm;
  }).slice(0, 15);

  wrap.innerHTML = sorted.map((shop, i) => {
    const tags = [];
    if(shop.rank1_count > 0) tags.push(`<span class="tag win1">${t('rank1Tag', { n: shop.rank1_count })}</span>`);
    if(shop.rank2_count > 0) tags.push(`<span class="tag win2">${t('rank2Tag', { n: shop.rank2_count })}</span>`);
    if(mode === 'amount') tags.push(`<span class="tag win2">${t('amountTag', { n: formatWon(shop.estAmount) })}</span>`);
    return `
      <div class="shop-card">
        <div class="rank-num">${i + 1}</div>
        <div class="shop-info">
          <div class="name">${shop.shp_nm}</div>
          <div class="addr">${shop.addr || ''}</div>
          <div class="tags">${tags.join('')}</div>
        </div>
        <div class="shop-side">
          <div class="dist">${formatDist(shop.distKm)}</div>
          <a class="go" target="_blank" rel="noopener" href="https://map.kakao.com/link/search/${encodeURIComponent(shop.addr || shop.shp_nm)}">${t('navLink')}</a>
        </div>
      </div>
    `;
  }).join('');
}

document.querySelectorAll('.segment div').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.segment div').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    renderShops(el.getAttribute('data-mode'));
  });
});

async function init(){
  const [{ lat, lon, isFallback }, avg] = await Promise.all([getUserLocation(), loadAvgPrizeAmounts()]);
  AVG_PRIZE = avg;

  document.getElementById('mapBadge').textContent = isFallback ? t('mapBadgeFallback') : t('mapBadgeGeo');

  try {
    const rows = await fetchNearbyShops(lat, lon);
    ALL_SHOPS = rows
      .filter(s => s.lat != null && s.lon != null)
      .map(s => ({
        ...s,
        distKm: haversineKm(lat, lon, s.lat, s.lon),
        estAmount: s.rank1_count * AVG_PRIZE.rank1 + s.rank2_count * AVG_PRIZE.rank2,
      }));
    document.getElementById('hdrSub').textContent = ALL_SHOPS.length
      ? t('hdrSubTpl', { n: ALL_SHOPS.length })
      : t('hdrSubEmpty');
  } catch(e) {
    console.warn('명당 데이터 조회 실패:', e);
    document.getElementById('hdrSub').textContent = t('hdrSubEmpty');
  }

  renderShops(currentMode);
}

init();
</script>

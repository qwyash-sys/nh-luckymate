<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NH행운메이트 - 로또 명당 찾기</title>
<style>
  :root {
    --primary: #00A651;
    --primary-dark: #007A3D;
    --primary-light: #E7F7EE;
    --primary-light2: #F0FBF4;
    --primary-border: #CDEEDA;
    --danger: #FF7272;
    --text-main: #111;
    --text-sub: #555;
    --text-mute: #999;
    --text-faint: #aaa;
    --bg-page: #EDEFF1;
    --bg-content: #F7F8FA;
    --bg-card: #fff;
    --border-light: #eee;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  button { all:unset; box-sizing:border-box; cursor:pointer; }
  body {
    font-family: 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background: var(--bg-page);
    display:flex; justify-content:center; align-items:flex-start;
    padding: 40px 0;
  }
  a { text-decoration:none; color:inherit; }
  .phone {
    width: 390px;
    background: var(--bg-card);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    border: 8px solid #1c1c1e;
    position: relative;
     display:flex; flex-direction:column;
  }
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff; padding: 14px 18px 18px;
  }
  .header .top {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    margin-bottom: 12px;
  }
  .header .top .back { justify-self:start; }
  .header .top .title { justify-self:center; text-align:center; }
  .header .top .top-actions { justify-self:end; }
  .header .top .back { font-size:18px; }
  .header .top .title { font-size:16px; font-weight:700; }
  .header .top .dots { display:flex; align-items:center; color:#fff; opacity:0.92; }
  .header .top .dots svg { width:20px; height:20px; display:block; }
  .header .top .top-actions { display:flex; align-items:center; gap:10px; }
  .fontsize-btn {
    all:unset; box-sizing:border-box; cursor:pointer;
    width:22px; height:22px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.75);
    font-size:11px; font-weight:800; color:#fff; opacity:0.92;
    display:flex; align-items:center; justify-content:center;
  }
  .fontsize-btn.active { background:#fff; color:var(--primary-dark); opacity:1; border-color:#fff; }
  /* 4060세대 접근성: 본문 영역 전체를 확대(zoom)해서 폰트/버튼/여백을 함께 키운다.
     헤더·상태바·탭바는 고정 UI 톤 유지를 위해 그대로 둔다. */
  body.large-text .content { zoom: 1.18; }
  .header .sub { font-size: 18px; font-weight:800; line-height:1.35; }
  .header .sub span { font-weight:400; font-size:12.5px; display:block; margin-top:4px; opacity:0.9;}

  .content {
    padding: 16px; background:var(--bg-content);
    height: 600px; overflow-y: auto;
  }

  .map-box {
    position:relative;
    height:150px; border-radius:16px; overflow:hidden; margin-bottom:14px;
    background:#EAF3EE;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .map-frame { width:100%; height:100%; border:0; display:block; }
  .map-box .badge {
    position:absolute; top:10px; right:10px; background:rgba(255,255,255,0.9);
    font-size:10px; color:var(--text-mute); padding:4px 8px; border-radius:20px; font-weight:600;
    cursor:pointer; max-width:calc(100% - 20px); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;
  }
  .my-loc-btn {
    all:unset; box-sizing:border-box; cursor:pointer;
    position:absolute; right:10px; bottom:10px; z-index:5;
    width:30px; height:30px; border-radius:50%; background:#fff;
    color:var(--primary-dark); box-shadow:0 2px 8px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center;
  }
  .my-loc-btn svg { width:17px; height:17px; display:block; }
  .my-loc-btn.loading { opacity:0.6; pointer-events:none; }

  .segment {
    display:flex; background:var(--bg-card); border-radius:12px; padding:4px;
    margin-bottom:14px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .segment div {
    flex:1; text-align:center; padding:9px 0; font-size:12.5px; font-weight:700;
    border-radius:9px; color:var(--text-mute); cursor:pointer;
  }
  .segment .active { background:var(--primary); color:#fff; }

  .shop-card {
    background:var(--bg-card); border-radius:16px; padding:14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    cursor:pointer; border:1.5px solid transparent;
  }
  .shop-card.selected { border-color:var(--primary); background:var(--primary-light); }
  .shop-card .rank-num {
    width:26px; height:26px; border-radius:50%; background:var(--primary-light);
    color:var(--primary-dark); font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .shop-info { flex:1; min-width:0; }
  .shop-info .name { font-size:14px; font-weight:800; color:var(--text-main); margin-bottom:3px; }
  .shop-info .addr { font-size:11px; color:var(--text-mute); margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shop-info .tags { display:flex; gap:5px; flex-wrap:wrap; }
  .tag { font-size:10px; font-weight:700; padding:3px 7px; border-radius:20px; white-space:nowrap; }
  .tag.win1 { background:#FFF1CE; color:#9A6B00; }
  .tag.win2 { background:var(--primary-light); color:var(--primary-dark); }
  .shop-side { text-align:right; flex-shrink:0; }
  .shop-side .dist { font-size:12px; font-weight:800; color:var(--primary-dark); white-space:nowrap; }
  .shop-side .go { display:block; font-size:10.5px; color:var(--text-mute); margin-top:6px; }

  .status-text { text-align:center; font-size:12px; color:var(--text-mute); padding:20px 0; }

  .filter-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .filter-label { font-size:11.5px; font-weight:700; color:var(--text-sub); }
  .range-select-wrap { position:relative; display:inline-flex; align-items:center; }
  select.range-select {
    appearance:none; -webkit-appearance:none; border:none;
    font-size:11.5px; color:var(--primary); font-weight:700;
    background:var(--primary-light); padding:5px 22px 5px 11px; border-radius:20px; cursor:pointer;
  }
  .range-select-wrap .range-arrow {
    position:absolute; right:9px; pointer-events:none; font-size:9px; color:var(--primary);
  }

  .subseg { display:flex; gap:6px; margin-bottom:12px; }
  .subseg button {
    flex:1; text-align:center; padding:7px 0; border-radius:20px;
    font-size:11.5px; font-weight:700; color:var(--text-mute);
    background:var(--bg-card); border:1px solid var(--border-light);
  }
  .subseg button.active { background:var(--primary-light); color:var(--primary-dark); border-color:var(--primary-border); }

  .btn-more {
    display:block; width:100%; text-align:center; margin-bottom:14px;
    font-size:12.5px; font-weight:700; color:var(--primary-dark);
    background:var(--bg-card); border:1px solid var(--primary-border); border-radius:12px; padding:11px;
  }

  .cta {
    display:block;
    margin-top: 4px; background:var(--primary); color:#fff; text-align:center;
    padding:13px; border-radius:12px; font-size:14px; font-weight:700;
  }
  .badge-note { font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:8px; line-height:1.5; }

  .tabbar {
    display:flex; border-top:1px solid var(--border-light); background:var(--bg-card); padding: 8px 0 14px;
  }
  .tabbar .tab { flex:1; text-align:center; font-size:10px; color:#bbb; }
  .tabbar .tab.active { color:var(--primary); font-weight:700; }
  .tabbar .tab .icon { font-size:18px; display:block; margin-bottom:3px; }

  /* ===== 권한 안내 팝업(위치 등) ===== */
  .confirm-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:none; align-items:center; justify-content:center; z-index:140; padding:0 28px;
  }
  .confirm-overlay.show { display:flex; }
  .confirm-box { width:100%; background:#fff; border-radius:16px; padding:22px 18px 18px; }
  .confirm-title { font-size:14.5px; font-weight:800; color:var(--text-main); text-align:center; margin-bottom:10px; }
  .confirm-msg { font-size:12.5px; color:var(--text-sub); line-height:1.65; text-align:center; margin-bottom:18px; }
  .confirm-btns { display:flex; gap:8px; }
  .confirm-btn { all:unset; box-sizing:border-box; cursor:pointer;
    flex:1; padding:12px 0; border-radius:10px; font-size:13px; font-weight:700;
    text-align:center;
  }
  .confirm-btn.primary { background:var(--primary); color:#fff; }

  /* ===== 세금상담 AI챗봇 ===== */
  .chat-fab, .chat-close { all:unset; box-sizing:border-box; cursor:pointer; }
  .chat-fab {
    position:absolute; right:16px; bottom:74px; z-index:60;
    width:50px; height:50px; border-radius:50%;
    background:linear-gradient(135deg,#0BBF63,#00893F);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,122,61,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .chat-fab:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,122,61,0.45); }
  .chat-fab svg { width:24px; height:24px; display:block; }
  .chat-fab .tip {
    position:absolute; right:58px; top:50%; transform:translateY(-50%);
    background:rgba(20,20,20,0.92); color:#fff; font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .chat-fab:hover .tip { opacity:1; }

  .chat-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:none; z-index:130; padding:10px;
  }
  .chat-overlay.show { display:block; }
  .chat-panel {
    width:100%; height:100%; background:#fff; border-radius:18px;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .chat-close {
    position:absolute; top:10px; right:10px; z-index:2;
    width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.07);
    color:var(--text-sub); font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-close:hover { background:rgba(0,0,0,0.12); }
  .chat-body { flex:1; display:flex; align-items:center; justify-content:center; }
  .chat-body iframe { width:100%; height:100%; border:0; }
  .chat-placeholder { text-align:center; color:var(--text-mute); font-size:12px; line-height:1.75; padding:0 26px; }
  .chat-placeholder .ico { font-size:30px; display:block; margin-bottom:12px; opacity:.45; }
  .chat-cta-title { font-size:15px; font-weight:800; color:var(--text-main); margin-top:2px; }
  .chat-cta-desc { font-size:12px; color:var(--text-mute); margin-top:6px; margin-bottom:18px; }
  .chat-cta-btn {
    display:inline-block; padding:12px 22px; border-radius:14px;
    background:linear-gradient(135deg,#0BBF63,#00893F); color:#fff;
    font-size:13.5px; font-weight:800; box-shadow:0 8px 20px rgba(0,122,61,0.3);
    transition:transform .15s ease;
  }
  .chat-cta-btn:active { transform:scale(0.97); }

  /* ===== 실제 모바일 기기 대응 =====
     데스크톱에서는 폰 목업 틀(테두리·그림자·여백)을 그대로 보여주지만,
     좁은 화면(실제 모바일)에서는 그 틀이 불필요한 겉치레라 벗기고 화면 전체를 채운다. */
  @media (max-width: 480px) {
    body { padding: 0; align-items: stretch; }
    .phone {
      width: 100%; min-height: 100vh;
      border: none; border-radius: 0; box-shadow: none;
      /* overflow:hidden(데스크톱 목업 틀의 둥근 모서리 클리핑용)을 그대로 두면
         스크롤이 이 안에서 다시 갇혀버려, 실제 페이지 스크롤과 어긋나
         position:sticky가 전혀 고정되지 않는 문제가 생긴다(하단 참고). */
      overflow: visible;
    }
    /* 데스크톱에서는 .content 자체가 내부 스크롤 패널(height:600px)이라
       overflow-y:auto가 스크롤 컨테이너 역할을 한다. 모바일에서 height:auto로
       내용에 맞춰 늘어나면 .content 안에서는 아무것도 스크롤할 게 없어지고
       실제 스크롤은 문서(페이지) 레벨에서 일어나는데, overflow-y:auto가 남아있으면
       CSS 스펙상 .content가 여전히 "가장 가까운 스크롤 컨테이너"로 잡혀 sticky의
       기준점이 되어버린다. 그 컨테이너 자체는 스크롤되지 않으니 sticky가 고정되지
       않고 페이지와 함께 그냥 흘러가버렸다(실제 발견된 버그). overflow를 visible로
       풀어야 sticky가 진짜 스크롤 주체인 문서를 기준으로 고정된다. */
    .content { flex: 1 1 auto; height: auto; overflow-y: visible; padding-bottom: 84px; }
    /* 스크롤해도 헤더·탭바·챗봇버튼이 화면에 고정되도록 */
    .header { position:sticky; top:0; z-index:50; }
    .tabbar { position:fixed; left:0; right:0; bottom:0; z-index:55; }
    .chat-fab { position:fixed; bottom:82px; }
  }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <div class="top">
      <a class="back" href="nh_luckymate_mockup.html">‹</a>
      <span class="title" data-i18n="hdrPageTitle">내 근처 로또 명당</span>
      <div class="top-actions"><button class="fontsize-btn" id="fontSizeBtn" aria-label="큰 글씨 보기">가</button><a class="dots" href="nh_luckymate_language.html" aria-label="언어 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.2 9h17.6M3.2 15h17.6"/><path d="M12 3c2.4 2.4 3.6 5.4 3.6 9s-1.2 6.6-3.6 9c-2.4-2.4-3.6-5.4-3.6-9S9.6 5.4 12 3z"/></svg></a></div>
    </div>
    <div class="sub">
      <span data-i18n="hdrTitle">1등 당첨 판매점이 여기 있어요</span>
      <span id="hdrSub">불러오는 중...</span>
    </div>
  </div>

  <div class="content">

    <div class="map-box">
      <div class="badge" id="mapBadge">📍 위치 확인 중...</div>
      <iframe id="mapFrame" class="map-frame" loading="lazy" referrerpolicy="no-referrer"></iframe>
      <button class="my-loc-btn" id="myLocBtn" aria-label="내 위치">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>

    <div class="filter-row">
      <span class="filter-label" data-i18n="radiusLabel">검색 반경</span>
      <div class="range-select-wrap">
        <select id="radiusSelect" class="range-select"></select>
        <span class="range-arrow">▾</span>
      </div>
    </div>

    <div class="segment">
      <div class="active" data-mode="dist" data-i18n="segDist">거리순</div>
      <div data-mode="count" data-i18n="segCount">당첨횟수순</div>
      <div data-mode="amount" data-i18n="segAmount">당첨금액순</div>
    </div>

    <div class="subseg" id="rankScope" style="display:none;">
      <button class="active" data-scope="both" data-i18n="scopeBoth">1·2등 합산</button>
      <button data-scope="r1" data-i18n="scopeR1">1등만</button>
      <button data-scope="r2" data-i18n="scopeR2">2등만</button>
    </div>

    <div id="shopList"><div class="status-text" id="statusText">불러오는 중...</div></div>
    <button class="btn-more" id="btnMoreShops" style="display:none;" data-i18n="btnMore">더보기</button>

    <a class="cta" href="nh_luckymate_guide.html" data-i18n="ctaGuide">당첨되면 어떻게 하나요? ›</a>
    <div class="badge-note" id="badgeNote">* 동행복권 당첨판매점 데이터(최근 100회차) 기준. 당첨금액은 등수별 평균 당첨금으로 추정한 값입니다</div>
  </div>

  <div class="confirm-overlay" id="locPermOverlay">
    <div class="confirm-box">
      <div class="confirm-title" data-i18n="locPermTitle">위치 권한이 꺼져 있어요</div>
      <div class="confirm-msg" id="locPermMsg">가까운 명당을 보여드리려면 위치 접근을 허용해주세요.</div>
      <div class="confirm-btns">
        <button class="confirm-btn primary" id="locPermConfirm" data-i18n="locPermConfirm">확인</button>
      </div>
    </div>
  </div>

  <button class="chat-fab" id="chatFab" aria-label="세금상담 AI챗봇">
    <span class="tip" data-i18n="chatbotLabel">세금상담 AI챗봇</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 11.7c0 4.3-3.8 7.8-8.5 7.8-1.3 0-2.5-.3-3.6-.8L3.5 20.4l1.6-4.3c-1-1.2-1.6-2.7-1.6-4.4 0-4.3 3.8-7.8 8.5-7.8s8.5 3.5 8.5 7.8z"/>
      <circle cx="8.8" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
      <circle cx="15.2" cy="11.7" r=".95" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-panel">
      <button class="chat-close" id="chatClose" aria-label="닫기">✕</button>
      <div class="chat-body" id="chatBody"></div>
    </div>
  </div>

  <div class="tabbar">
    <a class="tab" href="nh_luckymate_mockup.html"><span class="icon">🏠</span><span data-i18n="tabHome">당첨조회</span></a>
    <a class="tab" href="nh_luckymate_stats.html"><span class="icon">📊</span><span data-i18n="tabStats">재미로보는통계</span></a>
    <a class="tab active" href="nh_luckymate_spots.html"><span class="icon">📍</span><span data-i18n="tabSpots">명당찾기</span></a>
    <a class="tab" href="nh_luckymate_bonus.html"><span class="icon">💳</span><span data-i18n="tabBonus">우대금리</span></a>
    <a class="tab" href="nh_luckymate_guide.html"><span class="icon">🎯</span><span data-i18n="tabGuide">당첨가이드</span></a>
    <a class="tab" href="nh_luckymate_draw.html"><span class="icon">🎱</span><span data-i18n="tabDraw">로또뽑기</span></a>
  </div>

const FALLBACK_LAT = 37.5665;

const SEARCH_DELTA = 1.0; // 위경도 ±1.0도(약 111km) 바운딩 박스로 1차 조회 — 최대 반경 100km 선택까지 커버

/**
 * 바운딩 박스 안의 판매점을 모두 가져온다.
 * Supabase(PostgREST)는 limit을 크게 줘도 요청당 1000행에서 끊기므로,
 * 100km 반경처럼 박스 안에 1000곳이 넘는 경우를 위해 Range 헤더로 이어받는다.
 */
async function fetchNearbyShops(lat, lon){
  const base = `${SUPABASE_URL}/rest/v1/winning_shops?select=lt_shp_id,shp_nm,addr,region,lat,lon,rank1_count,rank2_count` +
    `&lat=gte.${lat - SEARCH_DELTA}&lat=lte.${lat + SEARCH_DELTA}` +
    `&lon=gte.${lon - SEARCH_DELTA}&lon=lte.${lon + SEARCH_DELTA}` +
    `&order=lt_shp_id.asc`;
  const PAGE = 1000;
  const all = [];

  for(let offset = 0; offset < 10000; offset += PAGE){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(base, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          Range: `${offset}-${offset + PAGE - 1}`,
        },
        signal: controller.signal,
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const rows = await res.json();
      all.push(...rows);
      if(rows.length < PAGE) break;
    } finally {
      clearTimeout(timer);
    }
  }
  return all;
}

function showLocPermModal(){
  document.getElementById('locPermMsg').innerHTML = t('locPermMsg');
  document.getElementById('locPermOverlay').classList.add('show');
}

function getUserLocation(){
  return new Promise(async (resolve) => {
    if(!navigator.geolocation){
      resolve({ lat: FALLBACK_LAT, lon: FALLBACK_LON, isFallback: true });
      return;
    }
    // 이미 거부된 상태면 getCurrentPosition을 다시 불러도 브라우저가 권한창을 다시 띄워주지 않으므로,
    // 미리 확인해서 우리가 직접 안내 팝업으로 권한 허용 방법을 알려준다.
    if(navigator.permissions && navigator.permissions.query){
      try {
        const status = await navigator.permissions.query({ name: 'geolocation' });
        if(status.state === 'denied'){
          showLocPermModal();
          resolve({ lat: FALLBACK_LAT, lon: FALLBACK_LON, isFallback: true });
          return;
        }
      } catch(e) { /* 위치 권한 조회를 지원하지 않는 브라우저는 그냥 getCurrentPosition으로 진행 */ }
    }
    const ok = (pos) => resolve({
      lat: pos.coords.latitude, lon: pos.coords.longitude,
      accuracy: pos.coords.accuracy, isFallback: false,
    });
    const fallback = () => resolve({ lat: FALLBACK_LAT, lon: FALLBACK_LON, isFallback: true });

    try {
      ok(await getBestPosition());
    } catch(err) {
      if(err && err.code === 1){ // PERMISSION_DENIED일 때만 안내(타임아웃 등은 제외)
        showLocPermModal();
        fallback();
        return;
      }
      // GPS가 안 잡히는 실내 등: 대략적인 위치(Wi-Fi/기지국)로라도 한 번 더 시도하고, 그래도 안 되면 서울 기준으로 보여준다.
      navigator.geolocation.getCurrentPosition(ok, fallback,
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
    }
  });
}

/* 위치 정확도 개선:
   기본 설정(enableHighAccuracy 꺼짐)은 Wi-Fi/기지국 기반의 대략적인 위치(수백 m~수 km 오차)를 주고,
   maximumAge가 길면 몇 분 전 위치를 재사용한다. 그래서 GPS를 켠 고정밀 모드 + 캐시 없이 요청하고,
   첫 값이 거칠 수 있어 watchPosition으로 몇 초간 더 정확한 값이 나오기를 기다렸다가 가장 정확한 값을 쓴다. */
const GOOD_ACCURACY_M = 50;
function getBestPosition(){
  return new Promise((resolve, reject) => {
    let best = null, done = false, watchId = null, timer = null;
    const finish = (err) => {
      if(done) return;
      done = true;
      navigator.geolocation.clearWatch(watchId);
      clearTimeout(timer);
      if(best) resolve(best); else reject(err || { code: 3 });
    };
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        if(!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
        if(pos.coords.accuracy <= GOOD_ACCURACY_M) finish();
      },
      (err) => { if(err.code === 1 || !best) finish(err); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
    timer = setTimeout(() => finish(), 8000);
  });
}

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDist(km){
  if(km < 1) return Math.round(km * 1000) + 'm';
  return km.toFixed(1) + 'km';
}

/* ===== 등수별 평균 당첨금 (당첨금액순 추정용) — mockup.html과 같은 캐시 재사용 ===== */
const DH_API_URL = 'https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do?srchLtEpsd=all';
const CACHE_KEY = 'nh_dh645_cache_v2';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000;
// API 연동 실패 시 폴백용 대략적인 평균 당첨금(과거 관측치 기준)
const FALLBACK_AVG = { rank1: 1800000000, rank2: 65000000 };

async function loadAvgPrizeAmounts(){
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && Array.isArray(cached.list) && cached.list.length && (Date.now() - cached.t < CACHE_TTL_MS)){
      return computeAvg(cached.list);
    }
  } catch(e) {}
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000); // 동행복권 응답이 7초를 넘는 경우가 있어 여유를 둠
    const res = await fetch(DH_API_URL, { signal: controller.signal });
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const raw = (json.data && json.data.list) || [];
    const list = raw.map(d => ({
      r: d.ltEpsd,
      amt: [d.rnk1WnAmt, d.rnk2WnAmt, d.rnk3WnAmt, d.rnk4WnAmt, d.rnk5WnAmt],
    })).sort((a, b) => a.r - b.r);
    if(!list.length) throw new Error('empty list');
    return computeAvg(list);
  } catch(e) {
    console.warn('평균 당첨금 계산용 API 연동 실패, 기본값 사용:', e);
    return FALLBACK_AVG;
  }
}
function computeAvg(list){
  const recent = list.slice(-100);
  const avg1 = recent.reduce((a, d) => a + d.amt[0], 0) / recent.length;
  const avg2 = recent.reduce((a, d) => a + d.amt[1], 0) / recent.length;
  return { rank1: avg1, rank2: avg2 };
}
function formatWon(amount){
  const eok = amount / 100000000; // 억 단위
  if(eok >= 1) return eok.toFixed(1) + '억원';
  return Math.round(amount / 10000) + '만원';
}

const RADIUS_OPTIONS = [3, 5, 10, 30, 50, 100];
const PAGE_SIZE = 10;

let ALL_SHOPS = [];
let AVG_PRIZE = FALLBACK_AVG;
let currentMode = 'dist';
let rankScope = 'both'; // both | r1 | r2 — 당첨횟수순·당첨금액순에서만 쓰임
let radiusKm = 10;
let shownCount = PAGE_SIZE;
let loadFailed = false;

/** 선택한 등수 범위 기준의 당첨 횟수 */
function scopedCount(shop){
  if(rankScope === 'r1') return shop.rank1_count;
  if(rankScope === 'r2') return shop.rank2_count;
  return shop.rank1_count + shop.rank2_count;
}
/** 선택한 등수 범위 기준의 추정 누적 당첨금 */
function scopedAmount(shop){
  const a1 = shop.rank1_count * AVG_PRIZE.rank1;
  const a2 = shop.rank2_count * AVG_PRIZE.rank2;
  if(rankScope === 'r1') return a1;
  if(rankScope === 'r2') return a2;
  return a1 + a2;
}

function visibleShops(){
  return ALL_SHOPS
    .filter(s => s.distKm <= radiusKm)
    .filter(s => currentMode === 'dist' || scopedCount(s) > 0)
    .sort((a, b) => {
      if(currentMode === 'count') return scopedCount(b) - scopedCount(a) || a.distKm - b.distKm;
      if(currentMode === 'amount') return scopedAmount(b) - scopedAmount(a) || a.distKm - b.distKm;
      return a.distKm - b.distKm;
    });
}

function renderShops(){
  const wrap = document.getElementById('shopList');
  const moreBtn = document.getElementById('btnMoreShops');
  document.getElementById('rankScope').style.display = currentMode === 'dist' ? 'none' : '';

  if(ALL_SHOPS.length === 0){
    wrap.innerHTML = `<div class="status-text">${t(loadFailed ? 'errorText' : 'emptyText')}</div>`;
    moreBtn.style.display = 'none';
    return;
  }

  const list = visibleShops();
  document.getElementById('hdrSub').textContent = list.length
    ? t('hdrSubTpl', { n: list.length })
    : t('hdrSubEmpty');

  if(list.length === 0){
    wrap.innerHTML = `<div class="status-text">${t('emptyInRadius')}</div>`;
    moreBtn.style.display = 'none';
    return;
  }

  const shown = list.slice(0, shownCount);
  wrap.innerHTML = shown.map((shop, i) => {
    const tags = [];
    if(shop.rank1_count > 0 && rankScope !== 'r2') tags.push(`<span class="tag win1">${t('rank1Tag', { n: shop.rank1_count })}</span>`);
    if(shop.rank2_count > 0 && rankScope !== 'r1') tags.push(`<span class="tag win2">${t('rank2Tag', { n: shop.rank2_count })}</span>`);
    if(currentMode === 'amount') tags.push(`<span class="tag win2">${t('amountTag', { n: formatWon(scopedAmount(shop)) })}</span>`);
    return `
      <div class="shop-card" data-idx="${i}">
        <div class="rank-num">${i + 1}</div>
        <div class="shop-info">
          <div class="name">${shop.shp_nm}</div>
          <div class="addr">${shop.addr || ''}</div>
          <div class="tags">${tags.join('')}</div>
        </div>
        <div class="shop-side">
          <div class="dist">${formatDist(shop.distKm)}</div>
          <a class="go" target="_blank" rel="noopener" href="https://map.kakao.com/link/search/${encodeURIComponent(shop.addr || shop.shp_nm)}">${t('navLink')}</a>
        </div>
      </div>
    `;
  }).join('');

  // 목록에서 판매점을 고르면 위 작은 지도가 그 위치로 이동해서 보여준다
  wrap.querySelectorAll('.shop-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.closest('.go')) return; // 길찾기 링크는 그대로 새 탭으로 보낸다
      const shop = shown[Number(card.getAttribute('data-idx'))];
      if(shop.lat == null || shop.lon == null) return;
      wrap.querySelectorAll('.shop-card.selected').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      focusMap({ lat: shop.lat, lon: shop.lon }, shop.shp_nm);
    });
  });

  moreBtn.style.display = shownCount < list.length ? '' : 'none';
  moreBtn.textContent = t('btnMoreTpl', { n: Math.min(PAGE_SIZE, list.length - shownCount) });
}

document.querySelectorAll('.segment div').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.segment div').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    currentMode = el.getAttribute('data-mode');
    shownCount = PAGE_SIZE;
    renderShops();
  });
});

document.querySelectorAll('#rankScope button').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('#rankScope button').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    rankScope = el.getAttribute('data-scope');
    shownCount = PAGE_SIZE;
    renderShops();
  });
});

document.getElementById('radiusSelect').addEventListener('change', e => {
  radiusKm = Number(e.target.value);
  shownCount = PAGE_SIZE;
  renderShops();
  renderMap(radiusKm);
});

document.getElementById('btnMoreShops').addEventListener('click', () => {
  shownCount += PAGE_SIZE;
  renderShops();
});

/* ===== 실제 지도 =====
   카카오맵 SDK는 앱키 발급이 필요해 이 프로토타입 단계에서는 쓸 수 없다.
   그 대신 앱키 없이 임베드 가능한 OpenStreetMap으로 내 위치 주변의 실제 지도를
   보여준다(장식용 좌표가 아니라 실제 위경도 기준). 선택한 검색 반경만큼
   화면에 보이는 범위(bbox)도 함께 넓어지도록 반경이 바뀔 때마다 다시 그린다.
   목록에서 판매점을 고르면 그 판매점 좌표로 지도를 확대 이동해서(focusMap)
   실제로 어디인지 보여주고, 배지를 다시 누르면 내 위치 기준으로 돌아온다. */
let mapCenter = null;
let mapIsFallback = false;
let mapAccuracyM = null; // 이번에 잡힌 위치의 오차 반경(m). 대략 위치/서울 기준일 땐 null

function setMapView(lat, lon, spanKm){
  // 위도 1도 ≈ 111km, 경도 1도는 위도가 높을수록 좁아지므로 cos(lat) 보정
  const latSpan = spanKm / 111;
  const lonSpan = spanKm / (111 * Math.cos(lat * Math.PI / 180));
  const bbox = [lon - lonSpan, lat - latSpan, lon + lonSpan, lat + latSpan].join(',');
  document.getElementById('mapFrame').src =
    `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}`;
}

function renderMap(radiusKm){
  if(!mapCenter) return;
  setMapView(mapCenter.lat, mapCenter.lon, radiusKm);
  document.getElementById('mapBadge').textContent = mapIsFallback ? t('mapBadgeFallback')
    : t('mapBadgeGeo') + (mapAccuracyM != null ? ' ±' + Math.round(mapAccuracyM) + 'm' : '');
}

function focusMap(point, label){
  setMapView(point.lat, point.lon, 0.8); // 판매점을 고르면 1km 안쪽으로 바짝 확대해서 보여준다
  document.getElementById('mapBadge').textContent = '📍 ' + label;
}

document.getElementById('mapBadge').addEventListener('click', () => {
  document.querySelectorAll('.shop-card.selected').forEach(c => c.classList.remove('selected'));
  renderMap(radiusKm);
});

/* 위치가 (재)확인될 때마다 지도 중심과 근처 판매점 목록을 함께 갱신한다.
   init()에서도, "내 위치" 버튼을 다시 눌렀을 때도 이 흐름을 그대로 재사용한다. */
async function applyLocation(lat, lon, isFallback, accuracy){
  mapCenter = { lat, lon };
  mapIsFallback = isFallback;
  mapAccuracyM = isFallback ? null : (accuracy ?? null);
  document.querySelectorAll('.shop-card.selected').forEach(c => c.classList.remove('selected'));
  renderMap(radiusKm);

  try {
    const rows = await fetchNearbyShops(lat, lon);
    ALL_SHOPS = rows
      .filter(s => s.lat != null && s.lon != null)
      .map(s => ({ ...s, distKm: haversineKm(lat, lon, s.lat, s.lon) }));
    loadFailed = false;
  } catch(e) {
    console.warn('명당 데이터 조회 실패:', e);
    loadFailed = true;
    document.getElementById('hdrSub').textContent = t('hdrSubError');
  }

  shownCount = PAGE_SIZE;
  renderShops();
}

async function goToMyLocation(){
  // 거부된 상태라면 getUserLocation() 내부에서 권한 안내 팝업을 띄워준다.
  // 이미 허용된 상태라면 실제 좌표로 지도·목록을 다시 그린다.
  const btn = document.getElementById('myLocBtn');
  btn.classList.add('loading');
  const { lat, lon, isFallback, accuracy } = await getUserLocation();
  btn.classList.remove('loading');
  await applyLocation(lat, lon, isFallback, accuracy);
}
document.getElementById('myLocBtn').addEventListener('click', goToMyLocation);

async function init(){
  const [{ lat, lon, isFallback, accuracy }, avg] = await Promise.all([getUserLocation(), loadAvgPrizeAmounts()]);
  AVG_PRIZE = avg;

  const radiusSel = document.getElementById('radiusSelect');
  radiusSel.innerHTML = RADIUS_OPTIONS.map(v => `<option value="${v}">${t('radiusOption', { n: v })}</option>`).join('');
  radiusSel.value = String(radiusKm);

  await applyLocation(lat, lon, isFallback, accuracy);
}

document.getElementById('locPermConfirm').addEventListener('click', () => {
  document.getElementById('locPermOverlay').classList.remove('show');
});

init();
</script>


<script>
/* ===== 세금상담 AI챗봇 =====
   챗봇 자체는 별도로 구현해 붙일 예정이라, 아래 주소만 채우면 바로 연결된다.
   비어 있으면 안내 문구를 대신 보여준다. */
const CHATBOT_URL = 'https://llm-tax-sj.streamlit.app/';
(function(){
  function chatT(key, fallback){
    try {
      const lang = localStorage.getItem('nh_lang') || 'ko';
      const dict = (typeof I18N !== 'undefined' && (I18N[lang] || I18N.ko)) || {};
      return dict[key] || fallback;
    } catch(e) { return fallback; }
  }

  const overlay = document.getElementById('chatOverlay');
  const body = document.getElementById('chatBody');
  let loaded = false;

  function openChat(){
    if(!loaded){
      const label = chatT('chatbotLabel', '세금상담 AI챗봇');
      const desc = chatT('chatbotDesc', '새 창에서 편하게 상담해보세요');
      const openBtnLabel = chatT('chatbotOpenBtn', '새 창에서 열기 ↗');
      body.innerHTML = CHATBOT_URL
        ? '<div class="chat-placeholder"><span class="ico">💬</span>' +
          '<div class="chat-cta-title">' + label + '</div>' +
          '<div class="chat-cta-desc">' + desc + '</div>' +
          '<button class="chat-cta-btn" id="chatOpenBtn">' + openBtnLabel + '</button></div>'
        : '<div class="chat-placeholder"><span class="ico">💬</span>' +
          chatT('chatbotPlaceholder', '세금상담 AI챗봇을 연결할 자리예요') + '</div>';
      loaded = true;
      const openBtn = document.getElementById('chatOpenBtn');
      if(openBtn) openBtn.addEventListener('click', function(){
        window.open(CHATBOT_URL, '_blank', 'noopener');
      });
    }
    overlay.classList.add('show');
  }
  function closeChat(){ overlay.classList.remove('show'); }

  document.getElementById('chatFab').addEventListener('click', openChat);
  document.getElementById('chatClose').addEventListener('click', closeChat);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeChat(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeChat(); });
})();
</script>

<script>
/* ===== 큰글씨 보기(4060세대 접근성) — 전 화면 공통, localStorage로 유지 ===== */
(function(){
  var FONT_KEY = 'nh_fontsize';
  function isLarge(){ try { return localStorage.getItem(FONT_KEY) === 'large'; } catch(e){ return false; } }
  function applyFontSize(){
    var on = isLarge();
    document.body.classList.toggle('large-text', on);
    var btn = document.getElementById('fontSizeBtn');
    if(btn) btn.classList.toggle('active', on);
  }
  document.addEventListener('DOMContentLoaded', function(){
    applyFontSize();
    var btn = document.getElementById('fontSizeBtn');
    if(btn){
      btn.addEventListener('click', function(){
        try { localStorage.setItem(FONT_KEY, isLarge() ? 'normal' : 'large'); } catch(e){}
        applyFontSize();
      });
    }
  });
})();
</script>
